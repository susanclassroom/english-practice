<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單字庫　隨時練</title>
<style>
  :root{
    --bg:#F7F5EF; --card:#fff; --ink:#26241F; --sub:#5A554C;
    --line:#E2DDD0; --brand:#1F6B58; --brand-soft:#E6F1ED;
    --gold:#C98A17; --gold-soft:#FDF3DE;
    --ok:#1F7A44; --ok-soft:#E4F3E9;
    --no:#B23A32; --no-soft:#FBE9E7; --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Hiragino Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:19px;line-height:1.75;-webkit-text-size-adjust:100%}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 72px}
  .hide{display:none!important}

  header{background:var(--brand);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  header h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
  header p{margin:0;font-size:16px;opacity:.92}
  .who{background:rgba(255,255,255,.16);border-radius:99px;padding:6px 16px;font-size:17px;white-space:nowrap}
  .who button{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;
    text-decoration:underline;font-family:inherit;padding:0 0 0 8px;opacity:.85}

  .seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;margin-top:18px}
  .seat{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px 0;
    font-size:24px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
  .seat:hover{border-color:var(--brand);background:var(--brand-soft)}
  .seat.guest{border-style:dashed;color:var(--sub);font-size:20px}

  /* 模式：練全部 / 只練沒過的 */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  @media(max-width:520px){.modes{grid-template-columns:1fr}}
  .mode{background:var(--card);border:2px solid var(--line);border-radius:var(--r);
    padding:14px 18px;cursor:pointer;font-family:inherit;font-size:18px;text-align:left;color:var(--ink)}
  .mode small{display:block;font-size:14px;color:var(--sub);font-weight:400;margin-top:2px}
  .mode:hover{border-color:var(--brand)}
  .mode.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .mode.on small{color:rgba(255,255,255,.85)}
  .mode.hot{border-color:var(--gold);background:var(--gold-soft)}
  .mode.hot.on{background:var(--gold);border-color:var(--gold);color:#fff}

  .picker{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .picker .lb{font-size:15px;color:var(--sub);margin-bottom:10px}
  .gs{display:flex;gap:8px;flex-wrap:wrap}
  .gchip{background:var(--card);border:2px solid var(--line);border-radius:99px;
    padding:7px 16px;font-size:17px;cursor:pointer;font-family:inherit;color:var(--sub)}
  .gchip:hover{border-color:var(--brand);color:var(--brand)}
  .gchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .gchip i{font-style:normal;opacity:.7;font-size:14px}

  .tabs{display:grid;gap:8px;margin-bottom:16px}
  .tab{background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:12px 6px;text-align:center;cursor:pointer;font-size:15px;line-height:1.4;
    color:var(--sub);transition:.15s}
  .tab b{display:block;font-size:19px;color:var(--ink);font-weight:600;margin-bottom:2px}
  .tab:hover{border-color:var(--brand)}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .tab.on b{color:#fff}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:14px;font-size:16px;color:var(--sub)}
  .bar .grow{flex:1;min-width:100px}
  .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--brand);width:0;transition:width .25s}
  .pill{background:var(--gold-soft);color:var(--gold);border-radius:99px;
    padding:3px 12px;font-size:15px;white-space:nowrap}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:26px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .stage{font-size:15px;color:var(--sub);margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .gtag{background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 12px;font-size:14px}

  .word{font-size:44px;font-weight:700;margin:6px 0 4px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;line-height:1.25}
  .zh{font-size:17px;color:var(--sub);margin:-2px 0 18px}
  .say{background:var(--brand-soft);border:none;border-radius:50%;width:44px;height:44px;
    font-size:20px;cursor:pointer;color:var(--brand);flex:none}
  .say:hover{background:#D5E7E1}
  .sent{font-size:23px;line-height:2;margin:6px 0 20px}
  .sent .gap{display:inline-block;min-width:116px;height:1.5em;vertical-align:-.3em;
    border-bottom:4px solid var(--gold);margin:0 4px}
  .hint{font-size:30px;letter-spacing:5px;color:var(--gold);font-weight:700;margin-bottom:4px}

  .opts{display:grid;gap:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  @media(max-width:560px){.opts.two{grid-template-columns:1fr}}
  .opt{background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:16px 18px;font-size:21px;text-align:left;cursor:pointer;
    font-family:inherit;color:var(--ink);transition:.12s}
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
  .opt.wrong{border-color:var(--no);background:var(--no-soft);color:var(--no)}

  .typebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
  input[type=text]{font-size:26px;padding:12px 16px;border:2px solid var(--line);
    border-radius:12px;font-family:inherit;width:300px;max-width:100%;letter-spacing:1px}
  input[type=text]:focus{outline:none;border-color:var(--brand)}

  button.go{background:var(--brand);color:#fff;border:none;border-radius:12px;
    padding:14px 26px;font-size:19px;cursor:pointer;font-family:inherit}
  button.go:hover{background:#17553f}
  button.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
  button.ghost:hover{background:var(--brand-soft)}

  .fb{margin-top:20px;padding:16px 18px;border-radius:12px;font-size:19px;display:none}
  .fb.show{display:block}
  .fb.good{background:var(--ok-soft);color:var(--ok)}
  .fb.bad{background:var(--no-soft);color:var(--no)}
  .fb .big{font-size:22px;font-weight:700;display:block;margin-bottom:4px}

  .done{text-align:center;padding:20px 0}
  .done .score{font-size:64px;font-weight:700;color:var(--brand);line-height:1.1}
  .done .of{font-size:20px;color:var(--sub);margin-bottom:16px}
  .done .best{display:inline-block;background:var(--gold-soft);color:var(--gold);
    border-radius:99px;padding:8px 20px;font-size:17px;margin-bottom:22px}
  .done .msg{font-size:21px;margin-bottom:24px}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  .review{margin-top:26px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:18px 20px}
  .review h3{margin:0 0 10px;font-size:18px;color:var(--sub);font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--no-soft);color:var(--no);border-radius:99px;padding:5px 14px;font-size:16px}
  .chip.clear{background:var(--ok-soft);color:var(--ok)}
  .mini{font-size:15px;color:var(--sub);margin-top:10px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .tools button{font-size:15px;padding:9px 16px;border-radius:10px;cursor:pointer;
    font-family:inherit;border:2px solid var(--line);background:var(--card);color:var(--sub)}
  .tools button:hover{border-color:var(--brand);color:var(--brand)}

  .hw{background:var(--gold-soft);border:2px solid #EBD9AE;border-radius:var(--r);
    padding:16px 20px;margin-bottom:16px;color:#6B4A0E}
  .hw.done{background:var(--ok-soft);border-color:#B9DCC6;color:var(--ok)}
  .hw .t{font-size:20px;font-weight:700}
  .hw ul{margin:10px 0 0;padding:0;list-style:none;font-size:17px}
  .hw li{margin:5px 0}
  .hw .n{margin:10px 0 0;font-size:15px;opacity:.85}
  .ok{color:var(--ok);font-weight:600}
  .wait{color:var(--sub)}

  .foot{margin-top:30px;text-align:center}
  .foot button{background:none;border:none;color:var(--sub);font-size:15px;
    cursor:pointer;font-family:inherit;text-decoration:underline;opacity:.7}
  h2.sec{font-size:22px;margin:0 0 4px}
  p.secsub{margin:0 0 18px;color:var(--sub);font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:17px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:15px;color:var(--sub);font-weight:600;white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.none td{color:var(--sub)}
  .seatlink{color:var(--brand);cursor:pointer;text-decoration:underline;font-weight:600}
  .barcell{display:flex;align-items:center;gap:8px}
  .barcell i{display:block;height:12px;background:var(--no);border-radius:3px;opacity:.75}
  .scroll{overflow-x:auto}
  .note{background:var(--gold-soft);border-radius:12px;padding:14px 16px;font-size:16px;color:#7A5410;margin:16px 0}
  .big2{font-size:34px;font-weight:700;color:var(--brand);line-height:1.2}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 20px}
  .kpi{background:var(--brand-soft);border-radius:12px;padding:14px 16px}
  .kpi span{display:block;font-size:15px;color:var(--sub)}
  @media print{ body{background:#fff} .noprint{display:none!important} .card{box-shadow:none;border:1px solid #ccc} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>單字庫　隨時練</h1>
    <p id="sub"></p>
  </div>
  <div class="who hide" id="who"></div>
</header>

<div id="viewSeat">
  <div class="card">
    <h2 class="sec" id="seatTitle">先選你的座號</h2>
    <p class="secsub">選了以後，你的練習紀錄就會分開存，不會跟別人混在一起。</p>
    <div class="seatgrid" id="seatgrid"></div>
  </div>
</div>

<div id="viewPractice" class="hide">
  <div id="hwPractice"></div>
  <div class="modes" id="modes"></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <span id="stageName"></span>
    <span class="grow"><span class="track"><span class="fill" id="fill"></span></span></span>
    <span id="count">0 / 0</span>
    <span class="pill" id="best">最佳 —</span>
  </div>
  <div class="card" id="card"></div>
  <div class="review">
    <h3>我還沒過的字</h3>
    <div class="chips" id="chips"></div>
    <p class="mini" id="mini"></p>
  </div>
</div>

<div id="viewTeacher" class="hide">
  <div class="card">
    <h2 class="sec">全班作答狀況</h2>
    <p class="secsub" id="tSub"></p>
    <div class="scroll"><table id="tClass"></table></div>
    <h2 class="sec" style="margin-top:32px">全班最常錯的字</h2>
    <p class="secsub">這是下一堂課最該花時間的地方。</p>
    <div class="scroll"><table id="tWrong"></table></div>
    <div class="tools noprint">
      <button onclick="exportCSV()">匯出 CSV</button>
      <button onclick="show('seat')">回到練習</button>
      <button onclick="wipe()">清空全部紀錄</button>
    </div>
  </div>
</div>

<div id="viewReport" class="hide">
  <div class="card">
    <h2 class="sec" id="rTitle">學習報告</h2>
    <p class="secsub" id="rRange"></p>
    <div class="kpis" id="rKpis"></div>
    <div class="note" id="rMsg"></div>
    <h2 class="sec" style="margin-top:26px;font-size:19px">每次練習紀錄</h2>
    <div class="scroll"><table id="rLogs"></table></div>
    <h2 class="sec" style="margin-top:26px;font-size:19px">目前還沒過的字</h2>
    <div class="chips" id="rChips"></div>
    <div class="tools noprint">
      <button onclick="window.print()">列印 / 存成 PDF</button>
      <button onclick="show('teacher')">回到全班</button>
    </div>
  </div>
</div>

<div class="foot noprint" id="foot"></div>

</div>

/* 班級名單 */
const CLASSES = {
  a: { name:"國三班", seats:[
    {n:"01", s:"靜"}, {n:"02", s:"若"}, {n:"03", s:"慧"}, {n:"04", s:"欣"},
    {n:"05", s:"衫"}, {n:"06", s:"睿"}, {n:"07", s:"芸"}, {n:"08", s:"蓁"},
    {n:"09", s:"亘"}, {n:"10", s:"晏"}, {n:"11", s:"裕"}, {n:"12", s:"瑋"},
    {n:"00", s:"訪客", guest:true}
  ]}
};
let _cid = ((new URLSearchParams(location.search).get("c")) || "a").toLowerCase();
if(!CLASSES[_cid]) _cid = "a";
const CLASS_ID = _cid;
const CLS = CLASSES[CLASS_ID];
const ROSTER = CLS.seats;
const ALL_SEATS = ROSTER.map(function(p){ return p.n; });
const SEAT_IDS  = ROSTER.filter(function(p){ return !p.guest; }).map(function(p){ return p.n; });
function isGuest(n){
  for(var i=0;i<ROSTER.length;i++){ if(String(ROSTER[i].n)===String(n)) return !!ROSTER[i].guest; }
  return false;
}
function sname(n){
  for(var i=0;i<ROSTER.length;i++){
    if(String(ROSTER[i].n)===String(n)) return ROSTER[i].n + (ROSTER[i].s ? " " + ROSTER[i].s : "");
  }
  return String(n);
}
const TEACHER_CODE = "2026";

const HOMEWORK = {
  on: false,                      // 隨時練預設不綁作業；要指定範圍時改成 true
  title: "本週作業",
  due: "",
  tasks: [ {stage:0, pass:18}, {stage:1, pass:14} ],
  note: "可以重複練很多次，算你最好的那一次。"
};

const GFORM = {
  url: "https://docs.google.com/forms/d/e/1FAIpQLSdG6ajrZXfG2LdjAXqsxCTwHrKhBo3aPA4U56Ug8ex0WMRMGw/formResponse",
  f: { seat:"entry.113402022", lesson:"entry.770464151", stage:"entry.1305707477",
       right:"entry.629191504", total:"entry.193167403", wrong:"entry.1924439157",
       hw:"entry.952655181" }
};
/* ======================================================= */

const KEY = "vocab_pool_" + CLASS_ID;
const STAGES = [
  {n:"第一階", t:"看得懂", d:"看英文，選中文"},
  {n:"第二階", t:"想得起來", d:"看中文，把單字拼出來"},
  {n:"第三階", t:"放進句子", d:"課本例句填空"}
];
WORDS.forEach(function(x,i){ x.id="w"+i; });
let store=load(), seat=null, stage=0, mode="all", queue=[], idx=0, right=0;

function load(){
  try{ const o=JSON.parse(localStorage.getItem(KEY)); if(o&&o.logs&&o.wrong) return o; }catch(e){}
  return {logs:[], wrong:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function wrongOf(s){ if(!store.wrong[s]) store.wrong[s]={}; return store.wrong[s]; }
function logsOf(s){ return store.logs.filter(function(l){ return String(l.seat)===String(s); }); }
function bestOf(s,st){
  const a=logsOf(s).filter(function(l){ return l.stage===st; }).map(function(l){ return l.right; });
  return a.length ? Math.max.apply(null,a) : null;
}
function ymd(ts){ const d=new Date(ts); return (d.getMonth()+1)+"/"+d.getDate(); }
function ymdhm(ts){ const d=new Date(ts);
  return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function norm(s){ return String(s).toLowerCase().replace(/[‘’'`]/g,"").replace(/\s+/g," ").trim(); }
function answersOf(w){
  const m=w.match(/^(.+?)\s*\((.+?)\)\s*$/);
  let list = m ? [m[1],m[2]] : [w];
  const out=[];
  list.forEach(function(x){ x.split("/").forEach(function(y){ y=y.trim(); if(y) out.push(y); }); });
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

document.getElementById("sub").textContent =
  "國中三年的字放在一起　·　共 " + WORDS.length + " 字";

function show(v){
  ["Seat","Practice","Teacher","Report"].forEach(function(n){
    document.getElementById("view"+n).classList.toggle("hide", n.toLowerCase()!==v); });
  document.getElementById("who").classList.toggle("hide", v==="seat");
  document.getElementById("foot").classList.toggle("hide", v!=="practice" && v!=="seat");
  window.scrollTo(0,0);
}

/* ---------- 座號 ---------- */
function drawSeats(){
  document.getElementById("seatTitle").textContent = CLS.name + "　先選你的座號";
  const g=document.getElementById("seatgrid"); g.innerHTML="";
  for(const i of ALL_SEATS){
    const b=document.createElement("button");
    b.className="seat"+(isGuest(i)?" guest":"");
    b.innerHTML=sname(i);
    b.onclick=function(){ seat=i; startSeat(); };
    g.appendChild(b);
  }
}
function updateWho(){
  const n=logsOf(seat).length;
  document.getElementById("who").innerHTML =
    CLS.name + "　" + sname(seat) + (n ? "　·　練過 " + n + " 次" : "")
    + "<button onclick=\"show('seat');drawSeats()\">換人</button>";
}
function startSeat(){
  updateWho(); show("practice");
  stage=0; mode="all";
  drawModes(); drawTabs(); start(); drawHw();
}

/* ---------- 作業 ---------- */
function hwStatus(s){
  if(!HOMEWORK.on) return null;
  const items=HOMEWORK.tasks.map(function(t){
    const b=bestOf(s,t.stage,HOMEWORK.range);
    return {stage:t.stage,pass:t.pass,best:b,ok:(b!=null&&b>=t.pass)};
  });
  const done=items.filter(function(x){return x.ok;}).length;
  return {items:items,done:done,all:items.length,complete:(done===items.length)};
}
function drawHw(){
  const box=document.getElementById("hwPractice"), st=hwStatus(seat);
  if(!st){ box.innerHTML=""; return; }
  const li=st.items.map(function(x){
    return "<li>"+(x.ok?"<span class='ok'>✅":"<span class='wait'>⬜")
      +" "+STAGES[x.stage].n+"　"+STAGES[x.stage].t+"　至少 "+x.pass+" 題"
      +(x.best==null?"（還沒做）":"（目前最好 "+x.best+" 題）")+"</span></li>"; }).join("");
  box.innerHTML="<div class='hw"+(st.complete?" done":"")+"'><div class='t'>"+HOMEWORK.title
    +"</div>"
    +(HOMEWORK.due?"<div style='font-size:16px'>繳交："+HOMEWORK.due+"</div>":"")
    +"<ul>"+li+"</ul><p class='n'>"+(st.complete?"🎉 本週作業完成了！":HOMEWORK.note)+"</p></div>";
}

/* ---------- 模式與範圍 ---------- */
function notPassed(x){ const w=wrongOf(seat); return !!w[x.id]; }
function todoCount(){ return WORDS.filter(notPassed).length; }

function drawModes(){
  const box=document.getElementById("modes"); const n=todoCount();
  box.innerHTML="";
  [["all","練全部的字", WORDS.length+" 個字"],
   ["todo","只練我還沒過的", n?n+" 個字":"目前沒有，先練全部"]].forEach(function(m){
    const b=document.createElement("button");
    b.className="mode"+(mode===m[0]?" on":"")+(m[0]==="todo"&&n?" hot":"");
    b.innerHTML="<b>"+m[1]+"</b><small>"+m[2]+"</small>";
    b.onclick=function(){ if(m[0]==="todo"&&!n) return; mode=m[0]; drawModes(); start(); };
    box.appendChild(b);
  });
}

/* ---------- 動態分頁（只顯示有題目的階） ---------- */
function bankOf(st){
  let list=WORDS.slice();
  if(mode==="todo") list=list.filter(notPassed);
  if(st===1) list=list.filter(function(x){ return x.w.indexOf("...")<0 && x.w.indexOf("…")<0; });  // 句型類打不出來
  if(st===2) list=list.filter(function(x){ return x.g; });
  return list;
}
function liveStages(){
  const out=[];
  for(let i=0;i<STAGES.length;i++){ if(bankOf(i).length) out.push(i); }
  return out;
}
function drawTabs(){
  const live=liveStages();
  if(live.indexOf(stage)<0 && live.length) stage=live[0];
  const box=document.getElementById("tabs");
  box.style.gridTemplateColumns="repeat("+Math.max(live.length,1)+",1fr)";
  box.innerHTML="";
  live.forEach(function(i){
    const d=document.createElement("div");
    d.className="tab"+(i===stage?" on":"");
    d.innerHTML="<b>"+STAGES[i].n+"</b>"+STAGES[i].t;
    d.onclick=function(){ stage=i; drawTabs(); start(); };
    box.appendChild(d);
  });
}

/* ---------- 出題 ---------- */
function start(){
  drawTabs();
  const all=shuffle(bankOf(stage));
  queue=all.slice(0, Math.min(ROUND, all.length));
  idx=0; right=0;
  document.getElementById("stageName").textContent=STAGES[stage].n+"　"+STAGES[stage].d;
  const b=bestOf(seat,stage);
  document.getElementById("best").textContent=b==null?"最佳 —":"最佳 "+b+" 題";
  if(!queue.length){
    document.getElementById("card").innerHTML=
      "<div class='done'><p class='msg'>這個範圍目前沒有題目。<br>換一個範圍，或按上面的「練全部的字」。</p></div>";
    drawChips(); return;
  }
  render(); drawChips();
}
function bar(){
  document.getElementById("count").textContent=idx+" / "+queue.length;
  document.getElementById("fill").style.width=(idx/queue.length*100)+"%";
}
function say(t){
  try{ const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85;
       speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function render(){
  bar();
  if(idx>=queue.length) return finish();
  const q=queue[idx], card=document.getElementById("card");
  const head="<div class='stage'><span>"+STAGES[stage].n+"　"+STAGES[stage].t+"</span></div>";
  const spoken=answersOf(q.w)[0].replace(/'/g,"\\'");

  if(stage===0){
    card.innerHTML=head
      +"<div class='word'>"+esc(q.w)+"<button class='say' onclick=\"say('"+spoken+"')\">🔊</button></div>"
      +"<div class='zh'>"+esc(q.p||"")+"</div>"
      +"<div class='opts two' id='opts'></div><div class='fb' id='fb'></div>";
    shuffle([q.z,q.n]).forEach(function(x){
      const b=document.createElement("button"); b.className="opt"; b.textContent=x;
      b.onclick=function(){ answer(x===q.z,q,q.z,b); };
      document.getElementById("opts").appendChild(b);
    });
  }else if(stage===1){
    const a0=answersOf(q.w)[0];
    const hint=a0[0]+a0.slice(1).replace(/[a-zA-Z]/g,"_");
    card.innerHTML=head
      +"<div class='word' style='font-size:34px'>"+esc(q.z)
      +"<button class='say' onclick=\"say('"+spoken+"')\">🔊</button></div>"
      +"<div class='zh'>"+esc(q.p||"")+"</div>"
      +"<div class='hint'>"+esc(hint)+"</div>"
      +"<div class='typebox'><input type='text' id='inp' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='把單字打出來'>"
      +"<button class='go' onclick='checkType()'>看看對不對</button></div>"
      +"<div class='fb' id='fb'></div>";
    const inp=document.getElementById("inp"); inp.focus();
    inp.onkeydown=function(e){ if(e.key==="Enter") checkType(); };
  }else{
    card.innerHTML=head
      +"<div class='sent'>"+esc(q.g).replace("___","<span class='gap'></span>")+"</div>"
      +"<div class='opts' id='opts'></div><div class='fb' id='fb'></div>";
    shuffle(q.o).forEach(function(x){
      const b=document.createElement("button"); b.className="opt"; b.textContent=x;
      b.onclick=function(){ answer(x===q.o[0],q,q.o[0],b); };
      document.getElementById("opts").appendChild(b);
    });
  }
}
function checkType(){
  const q=queue[idx], inp=document.getElementById("inp");
  const v=norm(inp.value);
  const ok=answersOf(q.w).some(function(a){ return norm(a)===v; });
  inp.disabled=true; answer(ok,q,answersOf(q.w)[0],null);
}
function answer(ok,q,correct,btn){
  document.querySelectorAll(".opt").forEach(function(b){
    b.disabled=true; if(b.textContent===correct) b.classList.add("right"); });
  if(btn&&!ok) btn.classList.add("wrong");
  const fb=document.getElementById("fb"), w=wrongOf(seat);
  fb.className="fb show "+(ok?"good":"bad");
  if(ok){ right++; w[q.id]=false;
    fb.innerHTML="<span class='big'>✓ 答對了</span>"+esc(q.w)+"　"+esc(q.z); }
  else{ w[q.id]=true;
    fb.innerHTML="<span class='big'>再看一次就好</span>正確答案是 <b>"+esc(correct)+"</b>　（"+esc(q.w)+"　"+esc(q.z)+"）"; }
  save(); drawChips(); drawModes(); say(answersOf(q.w)[0]);
  const next=document.createElement("button");
  next.className="go"; next.style.marginTop="16px";
  next.textContent=idx+1>=queue.length?"看結果":"下一題 →";
  next.onclick=function(){ idx++; render(); };
  fb.appendChild(document.createElement("br")); fb.appendChild(next); next.focus();
}
function finish(){
  const prevBest=bestOf(seat,stage), before=hwStatus(seat);
  store.logs.push({seat:seat,stage:stage,mode:mode,right:right,total:queue.length,ts:Date.now()});
  save(); drawHw(); updateWho(); drawModes();
  const after=hwStatus(seat);
  const justDone=after&&after.complete&&before&&!before.complete;
  sendOut(seat,stage,right,queue.length,after);

  const nowBest=bestOf(seat,stage), isBest=prevBest==null||right>prevBest;
  document.getElementById("count").textContent=queue.length+" / "+queue.length;
  document.getElementById("fill").style.width="100%";
  document.getElementById("best").textContent="最佳 "+nowBest+" 題";

  const left=todoCount();
  let msg; const rate=right/queue.length;
  if(justDone) msg="🎉 本週作業完成了！";
  else if(mode==="todo") msg = left ? "還沒過的字剩下 "+left+" 個。再跑一次會更少。"
                                    : "太厲害了，這個範圍的字你全部都過了！";
  else if(isBest&&prevBest!=null) msg="破紀錄了！上次 "+prevBest+" 題，這次 "+right+" 題。";
  else if(rate===1) msg="全對。往上一階試試看。";
  else msg="按上面的「只練我還沒過的」再跑一次，第二次一定會比第一次好。";

  const live=liveStages(), pos=live.indexOf(stage);
  document.getElementById("card").innerHTML=
    "<div class='done'><div class='score'>"+right+"</div>"
    +"<div class='of'>答對 "+right+" 題 / 共 "+queue.length+" 題</div>"
    +"<div class='best'>你的最佳紀錄："+nowBest+" 題</div><br>"
    +"<p class='msg'>"+msg+"</p><div class='btnrow'>"
    +"<button class='go' onclick='start()'>再練一次</button>"
    +(pos>=0&&pos<live.length-1
       ? "<button class='go ghost' onclick='stage="+live[pos+1]+";start()'>進到"+STAGES[live[pos+1]].n+" →</button>" : "")
    +"</div></div>";
  drawChips();
}
function drawChips(){
  const w=wrongOf(seat);
  const ks=WORDS.filter(function(x){ return w[x.id]; });
  const box=document.getElementById("chips"), mini=document.getElementById("mini");
  box.innerHTML="";
  if(!ks.length){
    box.innerHTML="<span class='chip clear'>目前沒有還沒過的字</span>";
    mini.textContent="答錯的字會自動留在這裡，答對之後就會消失。"; return;
  }
  ks.slice(0,40).forEach(function(x){
    const s=document.createElement("span"); s.className="chip"; s.textContent=x.w; box.appendChild(s); });
  mini.textContent="共 "+ks.length+" 個字"+(ks.length>40?"（只列前 40 個）":"")
    +"。按上面的「只練我還沒過的」就會只出這些。";
}

/* ---------- 送出 ---------- */
function sendOut(seat,stage,right,total,hw){
  if(!GFORM.url || isGuest(seat)) return;
  const w=store.wrong[seat]||{};
  const left=WORDS.filter(function(x){ return w[x.id]; });
  const row={};
  row[GFORM.f.seat]=CLASS_ID.toUpperCase()+"-"+sname(seat);
  row[GFORM.f.lesson]=LESSON;
  row[GFORM.f.stage]=STAGES[stage].n+" "+STAGES[stage].t+(mode==="todo"?"（只練沒過的）":"");
  row[GFORM.f.right]=right;
  row[GFORM.f.total]=total;
  row[GFORM.f.wrong]="還沒過 "+left.length+" 字：" + left.slice(0,12).map(function(x){return x.w;}).join(" ");
  row[GFORM.f.hw]=hw?(hw.complete?"已完成":"進行中 "+hw.done+"/"+hw.all):"";
  post(row);
}
function post(row){
  const body=new URLSearchParams();
  for(const k in row) body.append(k,row[k]);
  fetch(GFORM.url,{method:"POST",mode:"no-cors",body:body}).catch(function(){ queueRow(row); });
}
function queueRow(row){
  if(!store.pending) store.pending=[];
  store.pending.push(row);
  if(store.pending.length>200) store.pending=store.pending.slice(-200);
  save();
}
function flushPending(){
  if(!GFORM.url||!store.pending||!store.pending.length) return;
  const rows=store.pending.slice(); store.pending=[]; save();
  rows.forEach(function(r){ post(r); });
}

/* ---------- 老師檢視 ---------- */
function teacherGate(){
  const f=document.getElementById("foot");
  f.innerHTML="<div style='display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center'>"
    +"<input type='password' id='tcode' placeholder='老師密碼' autocomplete='off' "
    +  "style='font-size:17px;padding:9px 14px;border:2px solid #E2DDD0;border-radius:10px;width:150px;font-family:inherit'>"
    +"<button id='tgo' style='background:#1F6B58;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:16px;cursor:pointer;font-family:inherit;text-decoration:none'>進入</button>"
    +"<button id='tno' style='background:none;border:2px solid #E2DDD0;color:#5A554C;border-radius:10px;padding:9px 16px;font-size:16px;cursor:pointer;font-family:inherit;text-decoration:none'>取消</button>"
    +"<span id='tmsg' style='color:#B23A32;font-size:15px'></span></div>";
  const i=document.getElementById("tcode");
  document.getElementById("tgo").onclick=tryCode;
  document.getElementById("tno").onclick=resetFoot;
  i.onkeydown=function(e){ if(e.key==="Enter") tryCode(); };
  i.focus();
}
function tryCode(){
  if(document.getElementById("tcode").value!==TEACHER_CODE){
    document.getElementById("tmsg").textContent="密碼不對"; return; }
  resetFoot(); drawTeacher(); show("teacher");
}
function resetFoot(){
  const f=document.getElementById("foot");
  f.innerHTML="<button>老師檢視</button>";
  f.firstChild.onclick=teacherGate;
}
function leftOf(s){
  const w=store.wrong[s]||{};
  return WORDS.filter(function(x){ return w[x.id]; }).length;
}
function drawTeacher(){
  let doneN=0, hwDone=0;
  for(const i of SEAT_IDS){ if(logsOf(i).length) doneN++;
    const st=hwStatus(i); if(st&&st.complete) hwDone++; }
  document.getElementById("tSub").textContent=
    "全班 "+SEAT_IDS.length+" 人，已經練過的有 "+doneN+" 人"
    +(HOMEWORK.on?"，本週作業完成 "+hwDone+" 人":"")
    +"，總共 "+store.logs.filter(function(l){ return !isGuest(l.seat); }).length+" 次練習紀錄。";

  let h="<tr><th>座號</th><th class='num'>練習次數</th><th>最近一次</th>"
    +STAGES.map(function(s){ return "<th class='num'>"+s.t+"</th>"; }).join("")
    +"<th class='num'>還沒過</th></tr>";
  for(const i of SEAT_IDS){
    const ls=logsOf(i);
    if(!ls.length){
      h+="<tr class='none'><td>"+sname(i)+"</td><td class='num'>—</td><td>還沒做</td>"
        +STAGES.map(function(){ return "<td class='num'>—</td>"; }).join("")+"<td class='num'>—</td></tr>";
      continue;
    }
    const last=ls[ls.length-1];
    h+="<tr><td><span class='seatlink' onclick='drawReport(\""+i+"\")'>"+sname(i)+"</span></td>"
      +"<td class='num'>"+ls.length+"</td><td>"+ymdhm(last.ts)+"</td>"
      +STAGES.map(function(s,si){ const b=bestOf(i,si); return "<td class='num'>"+(b==null?"—":b)+"</td>"; }).join("")
      +"<td class='num'>"+leftOf(i)+"</td></tr>";
  }
  document.getElementById("tClass").innerHTML=h;

  const tally={};
  for(const i of SEAT_IDS){
    const w=store.wrong[i]||{};
    WORDS.forEach(function(x){ if(w[x.id]) tally[x.id]=(tally[x.id]||0)+1; });
  }
  const rank=Object.keys(tally).sort(function(a,b){ return tally[b]-tally[a]; });
  let h2="<tr><th>單字</th><th>中文</th><th class='num'>幾個人還沒過</th><th></th></tr>";
  if(!rank.length) h2+="<tr class='none'><td colspan='4'>還沒有資料</td></tr>";
  const maxN=rank.length?tally[rank[0]]:1;
  rank.slice(0,20).forEach(function(k){
    const wd=WORDS.filter(function(x){ return x.id===k; })[0];
    h2+="<tr><td><b>"+esc(wd.w)+"</b></td><td>"+esc(wd.z)+"</td><td class='num'>"+tally[k]+"</td>"
      +"<td><span class='barcell'><i style='width:"+(tally[k]/maxN*140)+"px'></i></span></td></tr>";
  });
  document.getElementById("tWrong").innerHTML=h2;
}

/* ---------- 個人報告 ---------- */
function drawReport(s){
  const ls=logsOf(s);
  document.getElementById("rTitle").textContent="座號 "+sname(s)+"　單字庫學習報告";
  if(!ls.length){ document.getElementById("rRange").textContent="還沒有練習紀錄。"; show("report"); return; }
  const first=ls[0], last=ls[ls.length-1];
  document.getElementById("rRange").textContent=
    "統計期間："+ymd(first.ts)+" ～ "+ymd(last.ts)+"　（"+POOL_NAME+"，共 "+WORDS.length+" 字）";
  const days={}; ls.forEach(function(l){ days[ymd(l.ts)]=1; });
  const w=store.wrong[s]||{};
  const left=WORDS.filter(function(x){ return w[x.id]; });
  const seen=WORDS.filter(function(x){ return w[x.id]!==undefined; });
  document.getElementById("rKpis").innerHTML=
    kpi("練習次數",ls.length+" 次")+kpi("練習天數",Object.keys(days).length+" 天")
    +kpi("碰過的字",seen.length+" / "+WORDS.length)
    +kpi("還沒過",left.length+" 字");
  document.getElementById("rMsg").textContent =
    ls.length>=3 ? "已經主動練了 "+ls.length+" 次。單字最需要的是反覆接觸，次數比分數重要。"
                 : "才剛開始，先看練習次數就好，分數會慢慢跟上來。";
  let h="<tr><th>日期</th><th>階段</th><th class='num'>答對</th><th class='num'>題數</th></tr>";
  ls.slice().reverse().forEach(function(l){
    h+="<tr><td>"+ymdhm(l.ts)+"</td>"
      +"<td>"+STAGES[l.stage].n+"　"+STAGES[l.stage].t+(l.mode==="todo"?"（只練沒過的）":"")+"</td>"
      +"<td class='num'>"+l.right+"</td><td class='num'>"+l.total+"</td></tr>"; });
  document.getElementById("rLogs").innerHTML=h;
  const box=document.getElementById("rChips"); box.innerHTML="";
  if(!left.length) box.innerHTML="<span class='chip clear'>目前沒有還沒過的字</span>";
  else left.slice(0,60).forEach(function(x){
    const e=document.createElement("span"); e.className="chip";
    e.textContent=x.w+"（"+x.z.split("；")[0]+"）"; box.appendChild(e); });
  show("report");
}
function kpi(l,v){ return "<div class='kpi'><span>"+l+"</span><b class='big2'>"+v+"</b></div>"; }

function exportCSV(){
  const rows=[["座號","日期時間","階段","模式","答對","題數"]];
  store.logs.filter(function(l){ return !isGuest(l.seat); })
    .sort(function(a,b){ return String(a.seat).localeCompare(String(b.seat))||a.ts-b.ts; })
    .forEach(function(l){
      rows.push([sname(l.seat),ymdhm(l.ts),
                 STAGES[l.stage].n+" "+STAGES[l.stage].t,(l.mode==="todo"?"只練沒過的":"全部"),l.right,l.total]); });
  const csv="﻿"+rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="單字庫練習紀錄_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function wipe(){
  if(!confirm("要清空全班所有紀錄嗎？這個動作無法復原。")) return;
  if(!confirm("再確認一次：所有座號的練習紀錄都會不見。")) return;
  store={logs:[],wrong:{}}; save(); drawTeacher(); drawSeats();
}

resetFoot(); drawSeats(); show("seat"); flushPending();
</script>
