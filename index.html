<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文練習</title>
<style>
  :root{
    --bg:#F7F5EF; --card:#fff; --ink:#26241F; --sub:#5A554C;
    --line:#E2DDD0; --brand:#1F6B58; --brand-soft:#E6F1ED;
    --gold:#C98A17; --gold-soft:#FDF3DE; --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Hiragino Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:19px;line-height:1.75;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 72px}
  header{background:var(--brand);color:#fff;border-radius:var(--r);padding:26px 24px;margin-bottom:20px}
  header h1{margin:0 0 6px;font-size:30px;letter-spacing:1px}
  header p{margin:0;font-size:17px;opacity:.92}

  .tip{background:var(--gold-soft);border:2px solid #EBD9AE;border-radius:var(--r);
    padding:16px 20px;margin-bottom:22px;color:#6B4A0E;font-size:17px}
  .tip b{font-size:19px}
  .tip ol{margin:10px 0 0;padding-left:22px}
  .tip li{margin:4px 0}

  h2{font-size:17px;color:var(--sub);font-weight:600;margin:0 0 12px;letter-spacing:1px}

  a.item{display:block;background:var(--card);border:2px solid var(--line);
    border-radius:var(--r);padding:22px 24px;margin-bottom:14px;
    text-decoration:none;color:inherit;transition:.15s}
  a.item:hover{border-color:var(--brand);background:var(--brand-soft)}
  a.item .k{display:inline-block;background:var(--brand);color:#fff;border-radius:99px;
    padding:3px 14px;font-size:15px;margin-bottom:8px}
  a.item .t{font-size:23px;font-weight:700;margin-bottom:4px}
  a.item .d{font-size:16px;color:var(--sub)}
  a.item .go{margin-top:10px;color:var(--brand);font-weight:600;font-size:17px}

  .soon{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);
    padding:20px 24px;color:var(--sub);font-size:17px}
  footer{margin-top:34px;text-align:center;color:var(--sub);font-size:15px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>英文練習</h1>
  <p>國三　第五冊（Book 5）</p>
</header>

<div class="tip">
  <b>怎麼用</b>
  <ol>
    <li>點下面的練習</li>
    <li>選你的<b>座號</b>（每次都要選同一個）</li>
    <li>照著「本週作業」上面寫的做</li>
  </ol>
</div>

<h2>目前的練習</h2>

<a class="item" href="l1-vocab.html">
  <span class="k">Lesson 1</span>
  <div class="t">L1 單字四階練習</div>
  <div class="d">Have You Ever Tried These Dishes?　共 28 個單字，從最簡單的一階開始，一階一階往上。</div>
  <div class="go">開始練習 →</div>
</a>

<div class="soon">Lesson 2 的練習準備中，很快就會放上來。</div>

<footer>淑媛老師的英文課</footer>

</div>
</body>
</html>
