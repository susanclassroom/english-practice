<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國三上 文法四階練習</title>
<style>
  :root{
    --bg:#F7F5EF; --card:#fff; --ink:#26241F; --sub:#5A554C;
    --line:#E2DDD0; --brand:#1F6B58; --brand-soft:#E6F1ED;
    --gold:#C98A17; --gold-soft:#FDF3DE;
    --ok:#1F7A44; --ok-soft:#E4F3E9;
    --no:#B23A32; --no-soft:#FBE9E7; --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Hiragino Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:19px;line-height:1.75;-webkit-text-size-adjust:100%}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 72px}
  .hide{display:none!important}

  header{background:var(--brand);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  header h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
  header p{margin:0;font-size:16px;opacity:.92}
  .who{background:rgba(255,255,255,.16);border-radius:99px;padding:6px 16px;font-size:17px;white-space:nowrap}
  .who button{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;
    text-decoration:underline;font-family:inherit;padding:0 0 0 8px;opacity:.85}

  .seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;margin-top:18px}
  .seat{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px 0;
    font-size:24px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
  .seat:hover{border-color:var(--brand);background:var(--brand-soft)}
  .seat.guest{border-style:dashed;color:var(--sub);font-size:20px}
  .seat .dot{display:block;font-size:12px;color:var(--ok);font-weight:400;line-height:1}

  .picker{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .picker .lb{font-size:15px;color:var(--sub);margin-bottom:10px}
  .gs{display:flex;gap:8px;flex-wrap:wrap}
  .gchip{background:var(--card);border:2px solid var(--line);border-radius:99px;
    padding:8px 18px;font-size:17px;cursor:pointer;font-family:inherit;color:var(--sub)}
  .gchip:hover{border-color:var(--brand);color:var(--brand)}
  .gchip.on{background:var(--brand);border-color:var(--brand);color:#fff}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .tab{background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:12px 6px;text-align:center;cursor:pointer;font-size:15px;line-height:1.4;
    color:var(--sub);transition:.15s}
  .tab b{display:block;font-size:19px;color:var(--ink);font-weight:600;margin-bottom:2px}
  .tab:hover{border-color:var(--brand)}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .tab.on b{color:#fff}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:14px;font-size:16px;color:var(--sub)}
  .bar .grow{flex:1;min-width:100px}
  .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--brand);width:0;transition:width .25s}
  .pill{background:var(--gold-soft);color:var(--gold);border-radius:99px;
    padding:3px 12px;font-size:15px;white-space:nowrap}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:26px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .stage{font-size:15px;color:var(--sub);margin-bottom:14px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .gtag{background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 12px;font-size:14px}
  .exam{background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:2px 12px;font-size:14px}

  .sent{font-size:23px;line-height:2;margin:6px 0 22px}
  .sent .gap{display:inline-block;min-width:116px;height:1.5em;vertical-align:-.3em;
    border-bottom:4px solid var(--gold);margin:0 4px}
  .word{font-size:40px;font-weight:700;margin:6px 0 4px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .zh{font-size:18px;color:var(--sub);margin:-4px 0 18px}
  .say{background:var(--brand-soft);border:none;border-radius:50%;width:44px;height:44px;
    font-size:20px;cursor:pointer;color:var(--brand);flex:none}
  .say:hover{background:#D5E7E1}

  .opts{display:grid;gap:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  @media(max-width:560px){.opts.two{grid-template-columns:1fr}}
  .opt{background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:16px 18px;font-size:21px;text-align:left;cursor:pointer;
    font-family:inherit;color:var(--ink);transition:.12s}
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
  .opt.wrong{border-color:var(--no);background:var(--no-soft);color:var(--no)}

  .typebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
  input[type=text]{font-size:26px;padding:12px 16px;border:2px solid var(--line);
    border-radius:12px;font-family:inherit;width:300px;max-width:100%;letter-spacing:1px}
  input[type=text]:focus{outline:none;border-color:var(--brand)}
  .hint{font-size:30px;letter-spacing:5px;color:var(--gold);font-weight:700;margin-bottom:4px}

  button.go{background:var(--brand);color:#fff;border:none;border-radius:12px;
    padding:14px 26px;font-size:19px;cursor:pointer;font-family:inherit}
  button.go:hover{background:#17553f}
  button.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
  button.ghost:hover{background:var(--brand-soft)}

  .fb{margin-top:20px;padding:16px 18px;border-radius:12px;font-size:19px;display:none}
  .fb.show{display:block}
  .fb.good{background:var(--ok-soft);color:var(--ok)}
  .fb.bad{background:var(--no-soft);color:var(--no)}
  .fb .big{font-size:22px;font-weight:700;display:block;margin-bottom:4px}

  .done{text-align:center;padding:20px 0}
  .done .score{font-size:64px;font-weight:700;color:var(--brand);line-height:1.1}
  .done .of{font-size:20px;color:var(--sub);margin-bottom:16px}
  .done .best{display:inline-block;background:var(--gold-soft);color:var(--gold);
    border-radius:99px;padding:8px 20px;font-size:17px;margin-bottom:22px}
  .done .msg{font-size:21px;margin-bottom:24px}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  .review{margin-top:26px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:18px 20px}
  .review h3{margin:0 0 10px;font-size:18px;color:var(--sub);font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--no-soft);color:var(--no);border-radius:99px;padding:5px 14px;font-size:16px}
  .chip.clear{background:var(--ok-soft);color:var(--ok)}
  .mini{font-size:15px;color:var(--sub);margin-top:10px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .tools button{font-size:15px;padding:9px 16px;border-radius:10px;cursor:pointer;
    font-family:inherit;border:2px solid var(--line);background:var(--card);color:var(--sub)}
  .tools button:hover{border-color:var(--brand);color:var(--brand)}

  .hw{background:var(--gold-soft);border:2px solid #EBD9AE;border-radius:var(--r);
    padding:16px 20px;margin-bottom:16px;color:#6B4A0E}
  .hw.done{background:var(--ok-soft);border-color:#B9DCC6;color:var(--ok)}
  .hw .t{font-size:20px;font-weight:700}
  .hw ul{margin:10px 0 0;padding:0;list-style:none;font-size:17px}
  .hw li{margin:5px 0}
  .hw .n{margin:10px 0 0;font-size:15px;opacity:.85}
  .ok{color:var(--ok);font-weight:600}
  .wait{color:var(--sub)}

  .foot{margin-top:30px;text-align:center}
  .foot button{background:none;border:none;color:var(--sub);font-size:15px;
    cursor:pointer;font-family:inherit;text-decoration:underline;opacity:.7}
  h2.sec{font-size:22px;margin:0 0 4px}
  p.secsub{margin:0 0 18px;color:var(--sub);font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:17px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:15px;color:var(--sub);font-weight:600;white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.none td{color:var(--sub)}
  .seatlink{color:var(--brand);cursor:pointer;text-decoration:underline;font-weight:600}
  .barcell{display:flex;align-items:center;gap:8px}
  .barcell i{display:block;height:12px;background:var(--no);border-radius:3px;opacity:.75}
  .scroll{overflow-x:auto}
  .note{background:var(--gold-soft);border-radius:12px;padding:14px 16px;
    font-size:16px;color:#7A5410;margin:16px 0}
  .big2{font-size:34px;font-weight:700;color:var(--brand);line-height:1.2}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 20px}
  .kpi{background:var(--brand-soft);border-radius:12px;padding:14px 16px}
  .kpi span{display:block;font-size:15px;color:var(--sub)}
  @media print{ body{background:#fff} .noprint{display:none!important} .card{box-shadow:none;border:1px solid #ccc} }
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:680px){.modes{grid-template-columns:1fr}}
  .mode{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;
    text-align:left;cursor:pointer;font-family:inherit}
  .mode b{display:block;font-size:16px;margin-bottom:2px}
  .mode small{color:#666;font-size:13.5px}
  .mode.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .mode.on small{color:#e8f3ec}
  .mode.hot{border-color:var(--gold);background:var(--gold-soft)}
  .mode.dead{opacity:.45;cursor:default}
  .prog{background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-bottom:14px}
  .prog .pt{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;
    justify-content:space-between;align-items:baseline;gap:10px}
  .prog .pt em{font-style:normal;color:var(--brand);font-size:20px}
  .prog .ptrack{height:12px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
  .prog .pdone{height:100%;background:var(--brand)}
  .prog .pleft{height:100%;background:var(--gold)}
  .prog .pn{margin-top:9px;font-size:14.5px;color:#555;line-height:1.7}
  .prog .pn b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>國三上　文法四階練習</h1>
    <p>第五冊 L1–L2　現在完成式・附加問句・that 名詞子句・it 虛主詞・情緒動詞</p>
  </div>
  <div class="who hide" id="who"></div>
</header>

<div id="viewSeat">
  <div id="hwSeat"></div>
  <div class="card">
    <h2 class="sec" id="seatTitle">先選你的座號</h2>
    <p class="secsub">選了以後，你的練習紀錄就會分開存，不會跟別人混在一起。</p>
    <div class="seatgrid" id="seatgrid"></div>
  </div>
</div>

<div id="viewPractice" class="hide">
  <div id="hwPractice"></div>
  <div class="picker">
    <div class="lb">要練哪個文法？</div>
    <div class="gs" id="gs"></div>
  </div>
  <div class="prog" id="prog"></div>
  <div class="modes" id="modes"></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <span id="stageName">第一階</span>
    <span class="grow"><span class="track"><span class="fill" id="fill"></span></span></span>
    <span id="count">0 / 0</span>
    <span class="pill" id="best">最佳 —</span>
  </div>
  <div class="card" id="card"></div>
  <div class="review">
    <h3>我還要再看的題目</h3>
    <div class="chips" id="chips"></div>
    <p class="mini" id="mini"></p>
    <div class="tools">
      <button onclick="onlyWrong()">只練錯過的題目</button>
      <button onclick="allItems()">練全部的題目</button>
    </div>
  </div>
</div>

<div id="viewTeacher" class="hide">
  <div class="card">
    <h2 class="sec">這台裝置上的作答狀況</h2>
    <p class="secsub" style="color:#b06a00">⚠ 這裡只看得到<b>在這台裝置上</b>練過的紀錄。學生用自己手機練的不會出現在這裡——全班的資料在 Google 試算表「K5-國三英文練習紀錄」。</p>
    <p class="secsub" id="tSub"></p>
    <div class="scroll"><table id="tClass"></table></div>
    <h2 class="sec" style="margin-top:32px">全班最常錯的文法點</h2>
    <p class="secsub">這是下一堂課最該花時間的地方。</p>
    <div class="scroll"><table id="tWrong"></table></div>
    <div class="tools noprint">
      <button onclick="exportCSV()">匯出 CSV（給家長／存檔用）</button>
      <button onclick="show('seat')">回到練習</button>
      <button onclick="wipe()">清空全部紀錄</button>
    </div>
  </div>
</div>

<div id="viewReport" class="hide">
  <div class="card">
    <h2 class="sec" id="rTitle">學習報告</h2>
    <p class="secsub" id="rRange"></p>
    <div class="kpis" id="rKpis"></div>
    <div class="note" id="rMsg"></div>
    <h2 class="sec" style="margin-top:26px;font-size:19px">每次練習紀錄</h2>
    <div class="scroll"><table id="rLogs"></table></div>
    <h2 class="sec" style="margin-top:26px;font-size:19px">目前還要再看的文法點</h2>
    <div class="chips" id="rChips"></div>
    <div class="tools noprint">
      <button onclick="window.print()">列印 / 存成 PDF</button>
      <button onclick="show('teacher')">回到全班</button>
    </div>
  </div>
</div>

<div class="foot noprint" id="foot"></div>

</div>
<script>
const GROUPS = [
  {id:"pp",   name:"現在完成式"},
  {id:"tag",  name:"附加問句"},
  {id:"that", name:"that 名詞子句"},
  {id:"it",   name:"it 虛主詞"},
  {id:"emo",  name:"情緒動詞"}
];

/* 第一階：看得懂（兩個選項，第一個是答案） */
const S1 = [
 {g:"pp", q:"Mary ___ washed the dishes.", o:["has","have"]},
 {g:"pp", q:"They ___ studied English for two hours.", o:["have","has"]},
 {g:"pp", q:"現在完成式的公式是 have / has ＋ ______", o:["過去分詞","動詞原形"]},
 {g:"pp", q:"He has ___ finished his work.（已經）", o:["already","yet"]},
 {g:"pp", q:"Have you eaten dinner ___?（還沒）", o:["yet","already"]},
 {g:"pp", q:"Jack isn't here. He has ___ to Japan.（人在日本）", o:["gone","been"]},
 {g:"pp", q:"Jack has ___ to Japan before.（去過，人不在那裡）", o:["been","gone"]},
 {g:"pp", q:"I have lived here ___ 1985.", o:["since","for"]},
 {g:"pp", q:"I have lived here ___ twenty years.", o:["for","since"]},
 {g:"pp", q:"「一段時間＋ago」要配哪個時態？", o:["過去簡單式","現在完成式"]},

 {g:"tag", q:"The weather is so nice, ___?", o:["isn't it","is it"]},
 {g:"tag", q:"Ken runs fast, ___?", o:["doesn't he","isn't he"]},
 {g:"tag", q:"You can't drive, ___?", o:["can you","can't you"]},
 {g:"tag", q:"That is a cellphone, isn't ___?", o:["it","that"]},
 {g:"tag", q:"These aren't your pens, are ___?", o:["they","these"]},
 {g:"tag", q:"There isn't any money in your pocket, is ___?", o:["there","it"]},
 {g:"tag", q:"Help me with my homework, ___?", o:["will you","do you"]},
 {g:"tag", q:"Let's go shopping now, ___?", o:["shall we","will you"]},
 {g:"tag", q:"Tim has watched TV for three hours, ___?", o:["hasn't he","doesn't he"]},
 {g:"tag", q:"You have to clean the room, ___?", o:["don't you","haven't you"]},
 {g:"tag", q:"Sam is never late for school, ___?（never 視為否定）", o:["is he","isn't he"]},
 {g:"tag", q:"肯定句後面要配什麼樣的附加問句？", o:["否定句","肯定句"]},

 {g:"that", q:"That Gina sings beautifully ___ well-known.", o:["is","are"]},
 {g:"that", q:"I agree ___ you are all very smart.", o:["that","what"]},
 {g:"that", q:"The only thing I know is ___ you are wrong.", o:["that","what"]},
 {g:"that", q:"that 名詞子句當主詞時，動詞用 ______", o:["單數","複數"]},
 {g:"that", q:"that 名詞子句當動詞的受詞時，that ______", o:["可以省略","不可以省略"]},

 {g:"it", q:"___ was crazy for Andy to go skydiving.", o:["It","That"]},
 {g:"it", q:"It is easy ___ me to fix the car.", o:["for","of"]},
 {g:"it", q:"It's kind ___ you to help me with my homework.", o:["of","for"]},
 {g:"it", q:"It's true ___ the Sun rises in the east.", o:["that","for"]},
 {g:"it", q:"形容詞在修飾「事物」時（easy／hard／possible）用 ______", o:["for","of"]},
 {g:"it", q:"形容詞在修飾「人」時（kind／smart／nice）用 ______", o:["of","for"]},

 {g:"emo", q:"The basketball game was very ___.（那場球賽很刺激）", o:["exciting","excited"]},
 {g:"emo", q:"The children got ___.（孩子們感到興奮）", o:["excited","exciting"]},
 {g:"emo", q:"Tina is ___ with the ball game.（她覺得無聊）", o:["bored","boring"]},
 {g:"emo", q:"The movie was ___.（那部電影很無聊）", o:["boring","bored"]},
 {g:"emo", q:"Jack is ___ in this movie.（他有興趣）", o:["interested","interesting"]},
 {g:"emo", q:"現在分詞（-ing）主要用來修飾 ______", o:["事物","人"]},
 {g:"emo", q:"過去分詞（-ed）主要用來修飾 ______", o:["人","事物"]},
 {g:"emo", q:"情緒動詞沒有哪一種時態？", o:["進行式","過去式"]}
];

/* 第二階：想得起來（打字） */
const S2 = [
 {g:"pp", p:"eat", zh:"吃　→　過去分詞", a:"eaten"},
 {g:"pp", p:"see", zh:"看見　→　過去分詞", a:"seen"},
 {g:"pp", p:"go", zh:"去　→　過去分詞", a:"gone"},
 {g:"pp", p:"do", zh:"做　→　過去分詞", a:"done"},
 {g:"pp", p:"take", zh:"拿　→　過去分詞", a:"taken"},
 {g:"pp", p:"write", zh:"寫　→　過去分詞", a:"written"},
 {g:"pp", p:"give", zh:"給　→　過去分詞", a:"given"},
 {g:"pp", p:"know", zh:"知道　→　過去分詞", a:"known"},
 {g:"pp", p:"speak", zh:"說　→　過去分詞", a:"spoken"},
 {g:"pp", p:"break", zh:"打破　→　過去分詞", a:"broken"},
 {g:"pp", p:"swim", zh:"游泳　→　過去分詞", a:"swum"},
 {g:"pp", p:"have", zh:"有　→　過去分詞", a:"had"},
 {g:"pp", p:"make", zh:"製作　→　過去分詞", a:"made"},
 {g:"pp", p:"buy", zh:"買　→　過去分詞", a:"bought"},
 {g:"pp", p:"teach", zh:"教　→　過去分詞", a:"taught"},
 {g:"pp", p:"begin", zh:"開始　→　過去分詞", a:"begun"},
 {g:"pp", p:"rise", zh:"上升　→　過去分詞", a:"risen"},
 {g:"pp", p:"send", zh:"寄送　→　過去分詞", a:"sent"},
 {g:"pp", p:"sell", zh:"賣　→　過去分詞", a:"sold"},
 {g:"pp", p:"read", zh:"讀　→　過去分詞（拼法不變）", a:"read"},

 {g:"tag", p:"The weather is so nice, ______?", zh:"填附加問句", a:"isn't it"},
 {g:"tag", p:"Ken runs fast, ______?", zh:"填附加問句", a:"doesn't he"},
 {g:"tag", p:"You can't drive, ______?", zh:"填附加問句", a:"can you"},
 {g:"tag", p:"Playing sports is good, ______?", zh:"填附加問句", a:"isn't it"},

function load(){

  return {logs:[], wrong:{}};
}

function wrongOf(s){ if(!store.wrong[s]) store.wrong[s]={}; return store.wrong[s]; }
function logsOf(s){ return store.logs.filter(function(l){ return String(l.seat)===String(s); }); }
function bestOf(s, st, g){
  const a = logsOf(s).filter(function(l){ return l.stage===st && (!g || g==="all" || l.group===g); })
                     .map(function(l){ return l.right; });
  return a.length ? Math.max.apply(null,a) : null;
}

/* ---------- 本週作業 ---------- */
function hwStatus(s){
  if(!HOMEWORK.on) return null;
  const items = HOMEWORK.tasks.map(function(t){
    const b = bestOf(s, t.stage, HOMEWORK.group);
    return {stage:t.stage, pass:t.pass, best:b, ok:(b!=null && b>=t.pass)};
  });
  const done = items.filter(function(x){return x.ok;}).length;
  return {items:items, done:done, all:items.length, complete:(done===items.length)};
}
function hwHead(){
  if(!HOMEWORK.on) return "";
  const g = HOMEWORK.group==="all" ? "全部文法" : gname(HOMEWORK.group);
  return "<div class='t'>" + HOMEWORK.title + "　·　" + g + "</div>"
       + (HOMEWORK.due ? "<div style='font-size:16px'>繳交：" + HOMEWORK.due + "</div>" : "");
}

  const box=document.getElementById("hwSeat");

    return "<li>⬜ " + STAGES[t.stage].n + "　" + STAGES[t.stage].t + "　至少答對 <b>" + t.pass + "</b> 題</li>";
  }).join("");
  box.innerHTML = "<div class='hw'>"+hwHead()+"<ul>"+li+"</ul><p class='n'>"+HOMEWORK.note+"</p></div>";
}

  const box=document.getElementById("hwPractice"), st=hwStatus(seat);

      + " " + STAGES[x.stage].n + "　" + STAGES[x.stage].t + "　至少 " + x.pass + " 題"
      + (x.best==null ? "（還沒做）" : "（目前最好 " + x.best + " 題）") + "</span></li>";
  }).join("");
  box.innerHTML = "<div class='hw"+(st.complete?" done":"")+"'>"+hwHead()+"<ul>"+li+"</ul>"

/* ---------- 進度與模式（都跟著目前選的文法點算） ---------- */
function groupItems(){
  let all=[];
  BANKS.forEach(function(b){ all=all.concat(b); });
  return group==="all" ? all : all.filter(function(x){ return x.g===group; });
}
function stageItems(){
  const b=BANKS[stage];
  return group==="all" ? b : b.filter(function(x){ return x.g===group; });
}
function newCount(){ const w=wrongOf(seat); return stageItems().filter(function(x){ return w[x.id]===undefined; }).length; }
function wrongCount(){ const w=wrongOf(seat); return stageItems().filter(function(x){ return w[x.id]===true; }).length; }

function drawProgress(){
  const box=document.getElementById("prog"); if(!box) return;
  const w=wrongOf(seat), items=groupItems(), total=items.length;
  let done=0,left=0;
  items.forEach(function(x){ if(w[x.id]===false) done++; else if(w[x.id]===true) left++; });
  const untouched=total-done-left, pct=total?Math.round(done/total*1000)/10:0;
  box.innerHTML="<div class='pt'><span>"+(group==="all"?"全部文法":gname(group))+"　總進度（四階合計）</span><em>"+pct+"%</em></div>"
   +"<div class='ptrack'><span class='pdone' style='width:"+(total?done/total*100:0)+"%'></span>"
   +"<span class='pleft' style='width:"+(total?left/total*100:0)+"%'></span></div>"
   +"<div class='pn'>已經會 <b>"+done+"</b> 題 ・ 還沒過 <b>"+left+"</b> 題 ・ "
   +"還沒練到 <b>"+untouched+"</b> 題 ・ 共 "+total+" 題</div>";
}
function drawModes(){
  const box=document.getElementById("modes"); if(!box) return;
  const nNew=newCount(), nWrong=wrongCount(), nAll=stageItems().length;
  box.innerHTML="";
  [["new","接著練", nNew ? "這一階沒練過的 "+nNew+" 題" : "這一階都練過了！"],
   ["wrong","只練我還沒過的", nWrong ? "這一階 "+nWrong+" 題" : "目前沒有"],
   ["all","全部複習", "這一階 "+nAll+" 題"]].forEach(function(m){
    const dead=(m[0]==="new"&&!nNew)||(m[0]==="wrong"&&!nWrong);
    const b=document.createElement("button");
    b.className="mode"+(poolMode===m[0]?" on":"")+(dead?" dead":"")
      +((m[0]==="wrong"&&nWrong&&poolMode!=="wrong")?" hot":"");
    b.innerHTML="<b>"+m[1]+"</b><small>"+m[2]+"</small>";
    b.onclick=function(){ if(dead) return; poolMode=m[0]; drawModes(); drawProgress(); start(); };
    box.appendChild(b);
  });
}

function pool(){
  let list = BANKS[stage];
  if(group!=="all") list = list.filter(function(x){ return x.g===group; });
  const w=wrongOf(seat);
  if(poolMode==="wrong"){
    const hit=list.filter(function(x){ return w[x.id]===true; });
    if(hit.length) list=hit;
  }
  if(poolMode==="new"){
    const hit=list.filter(function(x){ return w[x.id]===undefined; });
    if(hit.length) list=hit;
  }
  return list;
}
function start(){
  document.querySelectorAll(".tab").forEach(function(t,i){ t.classList.toggle("on", i===stage); });
  refreshMode(); drawModes(); drawProgress();   /* 模式若已無題目先換掉，別讓標籤說謊 */
  const all=shuffle(pool());
  queue = all.slice(0, Math.min(ROUND, all.length));
  idx=0; right=0;
  document.getElementById("stageName").textContent = STAGES[stage].n+"　"+STAGES[stage].d;
  const b=bestOf(seat, stage, group);
  document.getElementById("best").textContent = b==null ? "最佳 —" : "最佳 "+b+" 題";
  if(!queue.length){
    document.getElementById("card").innerHTML =
      "<div class='done'><p class='msg'>這一階目前沒有題目。<br>換一個文法點，或按下面的「練全部的題目」。</p></div>";
    drawChips(); return;
  }
  render(); drawChips();
}
function bar(){
  document.getElementById("count").textContent = idx+" / "+queue.length;
  document.getElementById("fill").style.width = (idx/queue.length*100)+"%";
}
function say(t){
  try{ const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85;
       speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function gapify(s){ return esc(s).replace("___","<span class='gap'></span>"); }

function render(){
  bar();
  if(idx>=queue.length) return finish();
  const q=queue[idx], card=document.getElementById("card");
  const head = "<div class='stage'><span>"+STAGES[stage].n+"　"+STAGES[stage].t+"</span>"
             + "<span class='gtag'>"+gname(q.g)+"</span>"
             + (q.t ? "<span class='exam'>"+esc(q.t)+"</span>" : "") + "</div>";

  if(stage===0){
    card.innerHTML = head + "<div class='sent'>"+gapify(q.q)+"</div>"
      + "<div class='opts two' id='opts'></div><div class='fb' id='fb'></div>";
    shuffle(q.o).forEach(function(x){
      const b=document.createElement("button"); b.className="opt"; b.textContent=x;
      b.onclick=function(){ answer(x===q.o[0], q, q.o[0], b); };
      document.getElementById("opts").appendChild(b);
    });
  } else if(stage===1){
    const rest=q.a.slice(1).replace(/[a-zA-Z]/g,"_");
    const isWord = !/\s|_/.test(q.p);
    card.innerHTML = head
      + (isWord
          ? "<div class='word'>"+esc(q.p)+"<button class='say' onclick=\"say('"+q.p+"')\">🔊</button></div>"
          : "<div class='sent'>"+esc(q.p)+"</div>")
      + "<div class='zh'>"+esc(q.zh)+"</div>"
      + "<div class='hint'>"+esc(q.a[0]+rest)+"</div>"
      + "<div class='typebox'><input type='text' id='inp' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='把答案打出來'>"
      + "<button class='go' onclick='checkType()'>看看對不對</button></div>"
      + "<div class='fb' id='fb'></div>";
    const inp=document.getElementById("inp"); inp.focus();
    inp.onkeydown=function(e){ if(e.key==="Enter") checkType(); };
  } else {
    card.innerHTML = head + "<div class='sent'>"+gapify(q.s)+"</div>"
      + "<div class='opts' id='opts'></div><div class='fb' id='fb'></div>";
    shuffle(q.o).forEach(function(x){
      const b=document.createElement("button"); b.className="opt"; b.textContent=x;
      b.onclick=function(){ answer(x===q.o[0], q, q.o[0], b); };
      document.getElementById("opts").appendChild(b);
    });
  }
}
function checkType(){
  const q=queue[idx], inp=document.getElementById("inp");
  const ok = norm(inp.value)===norm(q.a);
  inp.disabled=true; answer(ok, q, q.a, null);
}
function answer(ok, q, correct, btn){
  document.querySelectorAll(".opt").forEach(function(b){
    b.disabled=true; if(b.textContent===correct) b.classList.add("right");
  });
  if(btn && !ok) btn.classList.add("wrong");
  const fb=document.getElementById("fb"), w=wrongOf(seat);
  fb.className="fb show "+(ok?"good":"bad");
  if(ok){ right++; w[q.id]=false; fb.innerHTML="<span class='big'>✓ 答對了</span>"+gname(q.g); }
  else{ w[q.id]=true;
    fb.innerHTML="<span class='big'>再看一次就好</span>正確答案是 <b>"+esc(correct)+"</b>　（"+gname(q.g)+"）"; }
  save(); drawChips(); drawModes(); drawProgress();
  if(stage===1 && /^[a-zA-Z' ]+$/.test(q.a)) say(q.a);
  const next=document.createElement("button");
  next.className="go"; next.style.marginTop="16px";
  next.textContent = idx+1>=queue.length ? "看結果" : "下一題 →";
  next.onclick=function(){ idx++; render(); };
  fb.appendChild(document.createElement("br")); fb.appendChild(next); next.focus();
}
function finish(){
  const prevBest=bestOf(seat, stage, group);
  const before=hwStatus(seat);
  store.logs.push({seat:seat, stage:stage, group:group, right:right, total:queue.length,
                   ts:Date.now(), mode:poolMode});
  save(); drawHwPractice(); updateWho();
  const after=hwStatus(seat);
  const justDone = after && after.complete && before && !before.complete;
  sendOut(seat, stage, right, queue.length, after);

  const nowBest=bestOf(seat, stage, group), isBest = prevBest==null || right>prevBest;
  document.getElementById("count").textContent = queue.length+" / "+queue.length;
  document.getElementById("fill").style.width="100%";
  document.getElementById("best").textContent="最佳 "+nowBest+" 題";

  let msg; const rate=right/queue.length;
  if(justDone) msg="🎉 本週作業完成了！老師那邊會看到你做完了。";
  else if(isBest && prevBest!=null) msg="破紀錄了！上次 "+prevBest+" 題，這次 "+right+" 題。";
  else if(rate===1) msg="全對。這一階你已經過了，往上一階試試看。";
  else if(rate>=.7) msg="大部分都對了。錯的題目再練一次就好。";
  else msg="按下面的「只練錯過的題目」再跑一次，第二次一定會比第一次好。";

  document.getElementById("card").innerHTML =
    "<div class='done'><div class='score'>"+right+"</div>"
    + "<div class='of'>答對 "+right+" 題 / 共 "+queue.length+" 題（"+(group==="all"?"全部文法":gname(group))+"）</div>"
    + "<div class='best'>你的最佳紀錄："+nowBest+" 題</div><br>"
    + "<p class='msg'>"+msg+"</p><div class='btnrow'>"
    + "<button class='go' onclick='start()'>再練一次</button>"
    + (stage<3 ? "<button class='go ghost' onclick='stage="+(stage+1)+";start()'>進到"+STAGES[stage+1].n+" →</button>" : "")
    + "</div></div>";
  drawChips();
}
function wrongByGroup(s){
  const w = store.wrong[s]||{}, c={};
  BANKS.forEach(function(b){ b.forEach(function(it){ if(w[it.id]) c[it.g]=(c[it.g]||0)+1; }); });
  return c;
}
function drawChips(){
  const c=wrongByGroup(seat), ks=Object.keys(c);
  const box=document.getElementById("chips"), mini=document.getElementById("mini");
  box.innerHTML="";
  if(!ks.length){
    box.innerHTML="<span class='chip clear'>目前沒有要再看的題目</span>";
    mini.textContent="答錯的題目會自動留在這裡，答對之後就會消失。"; return;
  }
  let total=0;
  ks.sort(function(a,b){ return c[b]-c[a]; }).forEach(function(k){
    total+=c[k];
    const s=document.createElement("span"); s.className="chip";
    s.textContent=gname(k)+" "+c[k]; box.appendChild(s);
  });
  mini.textContent="共 "+total+" 題。按「只練錯過的題目」可以只練它們。";
}
function refreshMode(){ if((poolMode==="new"&&!newCount())||(poolMode==="wrong"&&!wrongCount()))
  poolMode = newCount() ? "new" : (wrongCount() ? "wrong" : "all"); }
function onlyWrong(){ poolMode="wrong"; drawModes(); drawProgress(); start(); }
function allItems(){ poolMode="all"; drawModes(); drawProgress(); start(); }

/* ---------- 送出 ---------- */
function sendOut(seat, stage, right, total, hw){
  if(!GFORM.url || isGuest(seat)) return;   // 訪客只存在本機，不進試算表
  const row={};
  row[GFORM.f.seat] = CLASS_ID.toUpperCase() + "-" + sname(seat);
  row[GFORM.f.lesson]=LESSON+"-"+(group==="all"?"全部":gname(group));
  row[GFORM.f.stage]=STAGES[stage].n+" "+STAGES[stage].t;
  row[GFORM.f.right]=right;
  row[GFORM.f.total]=total;
  row[GFORM.f.wrong]=Object.keys(wrongByGroup(seat)).map(function(k){
    return gname(k)+wrongByGroup(seat)[k]; }).join(" ");
  row[GFORM.f.hw]=hw ? (hw.complete?"已完成":"進行中 "+hw.done+"/"+hw.all) : "";
  post(row);
}
function post(row){
  const body=new URLSearchParams();
  for(const k in row) body.append(k, row[k]);
  fetch(GFORM.url,{method:"POST",mode:"no-cors",body:body}).catch(function(){ queueRow(row); });
}
function queueRow(row){
  if(!store.pending) store.pending=[];
  store.pending.push(row);
  if(store.pending.length>200) store.pending=store.pending.slice(-200);
  save();
}
function flushPending(){
  if(!GFORM.url || !store.pending || !store.pending.length) return;
  const rows=store.pending.slice(); store.pending=[]; save();
  rows.forEach(function(r){ post(r); });
}

/* ---------- 老師檢視 ---------- */
function teacherGate(){
  const f=document.getElementById("foot");
  f.innerHTML =
    "<div style='display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center'>"
    + "<input type='password' id='tcode' placeholder='老師密碼' autocomplete='off' "
    +   "style='font-size:17px;padding:9px 14px;border:2px solid #E2DDD0;border-radius:10px;width:150px;font-family:inherit'>"
    + "<button id='tgo' style='background:#1F6B58;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:16px;cursor:pointer;font-family:inherit;text-decoration:none'>進入</button>"
    + "<button id='tno' style='background:none;border:2px solid #E2DDD0;color:#5A554C;border-radius:10px;padding:9px 16px;font-size:16px;cursor:pointer;font-family:inherit;text-decoration:none'>取消</button>"
    + "<span id='tmsg' style='color:#B23A32;font-size:15px'></span></div>";
  const i=document.getElementById("tcode");
  document.getElementById("tgo").onclick=tryCode;
  document.getElementById("tno").onclick=resetFoot;
  i.onkeydown=function(e){ if(e.key==="Enter") tryCode(); };
  i.focus();
}
function tryCode(){
  if(document.getElementById("tcode").value!==TEACHER_CODE){
    document.getElementById("tmsg").textContent="密碼不對"; return;
  }
  resetFoot(); drawTeacher(); show("teacher");
}
function resetFoot(){
  const f=document.getElementById("foot");
  f.innerHTML="<button>老師檢視</button>";
  f.firstChild.onclick=teacherGate;
}
function drawTeacher(){
  const done=[]; let hwDone=0;
  for(const i of SEAT_IDS){
    if(logsOf(i).length) done.push(i);
    const st=hwStatus(i); if(st && st.complete) hwDone++;
  }
  document.getElementById("tSub").textContent =
    "全班 "+SEAT_IDS.length+" 人，已經練過的有 "+done.length+" 人"
    + (HOMEWORK.on ? "，本週作業完成 "+hwDone+" 人" : "")
    + "，總共 "+store.logs.filter(function(l){ return !isGuest(l.seat); }).length+" 次練習紀錄。";

  let h="<tr><th>座號</th><th>本週作業</th><th class='num'>練習次數</th><th>最近一次</th>"
      + STAGES.map(function(s){ return "<th class='num'>"+s.n+"</th>"; }).join("")
      + "<th class='num'>還要再看</th></tr>";
  for(const i of SEAT_IDS){
    const ls=logsOf(i), st=hwStatus(i);
    const c=wrongByGroup(i); let wn=0; for(const k in c) wn+=c[k];
    const hwCell = !st ? "—" : (st.complete ? "<span class='ok'>✅ 已完成</span>"
      : (ls.length ? "<span class='wait'>進行中 "+st.done+"/"+st.all+"</span>" : "<span class='wait'>未開始</span>"));
    if(!ls.length){
      h += "<tr class='none'><td>"+sname(i)+"</td><td>"+hwCell+"</td><td class='num'>—</td><td>還沒做</td>"
        + STAGES.map(function(){ return "<td class='num'>—</td>"; }).join("") + "<td class='num'>—</td></tr>";
      continue;
    }
    const last=ls[ls.length-1];
    h += "<tr><td><span class='seatlink' onclick='drawReport(\""+i+"\")'>"+sname(i)+"</span></td>"
       + "<td>"+hwCell+"</td><td class='num'>"+ls.length+"</td><td>"+ymdhm(last.ts)+"</td>"
       + STAGES.map(function(s,si){ const b=bestOf(i,si,HOMEWORK.group);
           return "<td class='num'>"+(b==null?"—":b)+"</td>"; }).join("")
       + "<td class='num'>"+wn+"</td></tr>";
  }
  document.getElementById("tClass").innerHTML=h;

  const tally={};
  for(const i of SEAT_IDS){ const c=wrongByGroup(i); for(const k in c) tally[k]=(tally[k]||0)+c[k]; }
  const rank=Object.keys(tally).sort(function(a,b){ return tally[b]-tally[a]; });
  let h2="<tr><th>文法點</th><th class='num'>全班還沒過的題數</th><th></th></tr>";
  if(!rank.length) h2+="<tr class='none'><td colspan='3'>還沒有資料</td></tr>";
  const maxN = rank.length ? tally[rank[0]] : 1;
  rank.forEach(function(k){
    h2+="<tr><td><b>"+gname(k)+"</b></td><td class='num'>"+tally[k]+"</td>"
      + "<td><span class='barcell'><i style='width:"+(tally[k]/maxN*160)+"px'></i></span></td></tr>";
  });
  document.getElementById("tWrong").innerHTML=h2;
}

/* ---------- 個人（家長）報告 ---------- */
function drawReport(s){
  const ls=logsOf(s);
  document.getElementById("rTitle").textContent="座號 "+s+"　文法練習報告";
  if(!ls.length){ document.getElementById("rRange").textContent="還沒有練習紀錄。"; show("report"); return; }
  const first=ls[0], last=ls[ls.length-1];
  document.getElementById("rRange").textContent =
    "統計期間："+ymd(first.ts)+" ～ "+ymd(last.ts)+"　（第五冊 L1–L2 文法）";
  const days={}; ls.forEach(function(l){ days[ymd(l.ts)]=1; });
  const stagesDone = STAGES.filter(function(x,i){ return bestOf(s,i,HOMEWORK.group)!=null; }).length;
  const c=wrongByGroup(s); let wn=0; for(const k in c) wn+=c[k];
  const st=hwStatus(s);
  document.getElementById("rKpis").innerHTML =
    kpi("練習次數", ls.length+" 次") + kpi("練習天數", Object.keys(days).length+" 天")
    + kpi("完成階數", stagesDone+" / 4 階") + kpi("還要再看", wn+" 題")
    + (st ? kpi("本週作業", st.complete?"已完成":"進行中 "+st.done+"/"+st.all) : "");

  let m;
  if(ls.length>=3) m="已經主動練了 "+ls.length+" 次。對這個階段來說，練習的次數比分數更重要。";
  else m="才剛開始，先看練習次數就好，分數會慢慢跟上來。";
  document.getElementById("rMsg").textContent=m;

  let h="<tr><th>日期</th><th>文法點</th><th>階段</th><th class='num'>答對</th><th class='num'>題數</th><th>備註</th></tr>";
  ls.slice().reverse().forEach(function(l){
    h+="<tr><td>"+ymdhm(l.ts)+"</td><td>"+(l.group==="all"?"全部":gname(l.group))+"</td>"
      + "<td>"+STAGES[l.stage].n+"　"+STAGES[l.stage].t+"</td>"
      + "<td class='num'>"+l.right+"</td><td class='num'>"+l.total+"</td>"
      + "<td>"+(l.mode==="wrong"?"只練錯過的":"")+"</td></tr>";
  });
  document.getElementById("rLogs").innerHTML=h;

  const box=document.getElementById("rChips"); box.innerHTML="";
  const ks=Object.keys(c);
  if(!ks.length) box.innerHTML="<span class='chip clear'>目前沒有要再看的題目</span>";
  else ks.sort(function(a,b){return c[b]-c[a];}).forEach(function(k){
    const e=document.createElement("span"); e.className="chip";
    e.textContent=gname(k)+" "+c[k]+" 題"; box.appendChild(e); });
  show("report");
}
function kpi(label,val){ return "<div class='kpi'><span>"+label+"</span><b class='big2'>"+val+"</b></div>"; }

function exportCSV(){
  const rows=[["座號","日期時間","文法點","階段","答對","題數","模式"]];
  store.logs.filter(function(l){ return !isGuest(l.seat); }).sort(function(a,b){ return a.seat-b.seat || a.ts-b.ts; }).forEach(function(l){
    rows.push([l.seat, ymdhm(l.ts), (l.group==="all"?"全部":gname(l.group)),
               STAGES[l.stage].n+" "+STAGES[l.stage].t, l.right, l.total,
               l.mode==="wrong"?"只練錯的":"全部"]);
  });
  const csv="﻿"+rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="文法練習紀錄_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function wipe(){
  if(!confirm("要清空全班所有紀錄嗎？這個動作無法復原。")) return;
  if(!confirm("再確認一次：所有座號的練習紀錄都會不見。")) return;
  store={logs:[],wrong:{}}; save(); drawTeacher(); drawSeats();
}

drawHwSeat(); resetFoot(); drawSeats(); show("seat"); flushPending();
</script>
