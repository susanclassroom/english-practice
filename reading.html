<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國三上 閱讀四階練習</title>
<style>
  :root{
    --bg:#F7F5EF; --card:#fff; --ink:#26241F; --sub:#5A554C;
    --line:#E2DDD0; --brand:#1F6B58; --brand-soft:#E6F1ED;
    --gold:#C98A17; --gold-soft:#FDF3DE;
    --ok:#1F7A44; --ok-soft:#E4F3E9;
    --no:#B23A32; --no-soft:#FBE9E7; --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Hiragino Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:19px;line-height:1.75;-webkit-text-size-adjust:100%}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 72px}
  .hide{display:none!important}

  header{background:var(--brand);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  header h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
  header p{margin:0;font-size:16px;opacity:.92}
  .who{background:rgba(255,255,255,.16);border-radius:99px;padding:6px 16px;font-size:17px;white-space:nowrap}
  .who button{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;
    text-decoration:underline;font-family:inherit;padding:0 0 0 8px;opacity:.85}

  .seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;margin-top:18px}
  .seat{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px 0;
    font-size:24px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
  .seat:hover{border-color:var(--brand);background:var(--brand-soft)}
  .seat.guest{border-style:dashed;color:var(--sub);font-size:20px}
  .seat .dot{display:block;font-size:12px;color:var(--ok);font-weight:400;line-height:1}

  a.rcard,.rcard{display:block;background:var(--card);border:2px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:14px;text-decoration:none;color:inherit;cursor:pointer;
    transition:.15s;text-align:left;width:100%;font-family:inherit;font-size:19px}
  .rcard:hover{border-color:var(--brand);background:var(--brand-soft)}
  .rcard .no{display:inline-block;background:var(--brand);color:#fff;border-radius:99px;
    padding:3px 14px;font-size:15px;margin-bottom:8px}
  .rcard .t{font-size:22px;font-weight:700;margin-bottom:2px}
  .rcard .z{font-size:17px;color:var(--sub);margin-bottom:6px}
  .rcard .m{font-size:15px;color:var(--sub)}
  .rcard .m b{color:var(--ok)}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .tab{background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:12px 6px;text-align:center;cursor:pointer;font-size:15px;line-height:1.4;
    color:var(--sub);transition:.15s}
  .tab b{display:block;font-size:19px;color:var(--ink);font-weight:600;margin-bottom:2px}
  .tab:hover{border-color:var(--brand)}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .tab.on b{color:#fff}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:14px;font-size:16px;color:var(--sub)}
  .bar .grow{flex:1;min-width:100px}
  .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--brand);width:0;transition:width .25s}
  .pill{background:var(--gold-soft);color:var(--gold);border-radius:99px;
    padding:3px 12px;font-size:15px;white-space:nowrap}

  /* 中文背景導讀 */
  .bgbox{background:#EFF4FB;border:2px solid #CFDCEF;border-radius:var(--r);
    padding:20px 22px;margin-bottom:16px;color:#22405F}
  .bgbox h3{margin:0 0 10px;font-size:20px}
  .bgbox p{margin:0 0 10px;font-size:18px;line-height:1.9}
  .bgbox p:last-child{margin-bottom:0}
  .bgbox b{color:#123A63}

  /* 文章 */
  .art{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:0;margin-bottom:16px;overflow:hidden}
  .art .h{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 20px;background:var(--brand-soft);cursor:pointer;font-size:17px;color:var(--brand);font-weight:600}
  .art .h span.sm{font-weight:400;color:var(--sub);font-size:15px}
  .art .b{padding:18px 22px 22px}
  .art .b.closed{display:none}
  .para{display:flex;gap:12px;margin-bottom:14px}
  .para .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold-soft);
    color:var(--gold);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:5px}
  .para .x{font-size:19px;line-height:2}
  .line{display:flex;gap:10px;margin-bottom:10px;font-size:19px;line-height:1.95}
  .line .w{flex:none;color:var(--brand);font-weight:700;min-width:56px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:26px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .stage{font-size:15px;color:var(--sub);margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .exam{background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:2px 12px;font-size:14px}

  .qz{font-size:23px;line-height:1.9;margin:6px 0 20px}
  .word{font-size:42px;font-weight:700;margin:6px 0 4px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .say{background:var(--brand-soft);border:none;border-radius:50%;width:44px;height:44px;
    font-size:20px;cursor:pointer;color:var(--brand);flex:none}
  .say:hover{background:#D5E7E1}

  .opts{display:grid;gap:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  @media(max-width:560px){.opts.two{grid-template-columns:1fr}}
  .opt{background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:16px 18px;font-size:20px;text-align:left;cursor:pointer;
    font-family:inherit;color:var(--ink);transition:.12s;line-height:1.6}
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
  .opt.wrong{border-color:var(--no);background:var(--no-soft);color:var(--no)}

  button.go{background:var(--brand);color:#fff;border:none;border-radius:12px;
    padding:14px 26px;font-size:19px;cursor:pointer;font-family:inherit}
  button.go:hover{background:#17553f}
  button.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
  button.ghost:hover{background:var(--brand-soft)}

  .fb{margin-top:20px;padding:16px 18px;border-radius:12px;font-size:19px;display:none}
  .fb.show{display:block}
  .fb.good{background:var(--ok-soft);color:var(--ok)}
  .fb.bad{background:var(--no-soft);color:var(--no)}
  .fb .big{font-size:22px;font-weight:700;display:block;margin-bottom:4px}

  .done{text-align:center;padding:20px 0}
  .done .score{font-size:64px;font-weight:700;color:var(--brand);line-height:1.1}
  .done .of{font-size:20px;color:var(--sub);margin-bottom:16px}
  .done .best{display:inline-block;background:var(--gold-soft);color:var(--gold);
    border-radius:99px;padding:8px 20px;font-size:17px;margin-bottom:22px}
  .done .msg{font-size:21px;margin-bottom:24px}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  .review{margin-top:26px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:18px 20px}
  .review h3{margin:0 0 10px;font-size:18px;color:var(--sub);font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--no-soft);color:var(--no);border-radius:99px;padding:5px 14px;font-size:16px}
  .chip.clear{background:var(--ok-soft);color:var(--ok)}
  .mini{font-size:15px;color:var(--sub);margin-top:10px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .tools button{font-size:15px;padding:9px 16px;border-radius:10px;cursor:pointer;
    font-family:inherit;border:2px solid var(--line);background:var(--card);color:var(--sub)}
  .tools button:hover{border-color:var(--brand);color:var(--brand)}

  .hw{background:var(--gold-soft);border:2px solid #EBD9AE;border-radius:var(--r);
    padding:16px 20px;margin-bottom:16px;color:#6B4A0E}
  .hw.done{background:var(--ok-soft);border-color:#B9DCC6;color:var(--ok)}
  .hw .t{font-size:20px;font-weight:700}
  .hw ul{margin:10px 0 0;padding:0;list-style:none;font-size:17px}
  .hw li{margin:5px 0}
  .hw .n{margin:10px 0 0;font-size:15px;opacity:.85}
  .ok{color:var(--ok);font-weight:600}
  .wait{color:var(--sub)}

  .foot{margin-top:30px;text-align:center}
  .foot button{background:none;border:none;color:var(--sub);font-size:15px;
    cursor:pointer;font-family:inherit;text-decoration:underline;opacity:.7}
  h2.sec{font-size:22px;margin:0 0 4px}
  p.secsub{margin:0 0 18px;color:var(--sub);font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:17px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:15px;color:var(--sub);font-weight:600;white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.none td{color:var(--sub)}
  .seatlink{color:var(--brand);cursor:pointer;text-decoration:underline;font-weight:600}
  .barcell{display:flex;align-items:center;gap:8px}
  .barcell i{display:block;height:12px;background:var(--no);border-radius:3px;opacity:.75}
  .scroll{overflow-x:auto}
  .note{background:var(--gold-soft);border-radius:12px;padding:14px 16px;font-size:16px;color:#7A5410;margin:16px 0}
  .big2{font-size:34px;font-weight:700;color:var(--brand);line-height:1.2}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 20px}
  .kpi{background:var(--brand-soft);border-radius:12px;padding:14px 16px}
  .kpi span{display:block;font-size:15px;color:var(--sub)}
  @media print{ body{background:#fff} .noprint{display:none!important} .card{box-shadow:none;border:1px solid #ccc} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>國三上　閱讀四階練習</h1>
    <p>先補背景，再讀文章　·　三篇由淺入深</p>
  </div>
  <div class="who hide" id="who"></div>
</header>

<div id="viewSeat">
  <div id="hwSeat"></div>
  <div class="card">
    <h2 class="sec" id="seatTitle">先選你的座號</h2>
    <p class="secsub">選了以後，你的練習紀錄就會分開存，不會跟別人混在一起。</p>
    <div class="seatgrid" id="seatgrid"></div>
  </div>
</div>

<div id="viewPick" class="hide">
  <div id="hwPick"></div>
  <h2 class="sec">選一篇來讀</h2>
  <p class="secsub">建議照順序讀，從最短、最貼近生活的開始。</p>
  <div id="rlist"></div>
  <div class="foot noprint"><button onclick="show('seat');drawSeats()">換座號</button></div>
</div>

<div id="viewPractice" class="hide">
  <div id="hwPractice"></div>
  <div id="bgbox"></div>
  <div id="artbox"></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <span id="stageName">第一階</span>
    <span class="grow"><span class="track"><span class="fill" id="fill"></span></span></span>
    <span id="count">0 / 0</span>
    <span class="pill" id="best">最佳 —</span>
  </div>
  <div class="card" id="card"></div>
  <div class="review">
    <h3>我還要再看的題目</h3>
    <div class="chips" id="chips"></div>
    <p class="mini" id="mini"></p>
    <div class="tools">
      <button onclick="onlyWrong()">只練錯過的題目</button>
      <button onclick="allItems()">練全部的題目</button>
      <button onclick="show('pick');drawList()">換一篇文章</button>
    </div>
  </div>
</div>

<div id="viewTeacher" class="hide">
  <div class="card">
    <h2 class="sec">全班作答狀況</h2>
    <p class="secsub" id="tSub"></p>
    <div class="scroll"><table id="tClass"></table></div>
    <h2 class="sec" style="margin-top:32px">全班最卡的地方</h2>
    <p class="secsub">看是卡在生字、卡在找不到，還是卡在讀不懂。</p>
    <div class="scroll"><table id="tWrong"></table></div>
    <div class="tools noprint">
      <button onclick="exportCSV()">匯出 CSV（給家長／存檔用）</button>
      <button onclick="show('seat')">回到練習</button>
      <button onclick="wipe()">清空全部紀錄</button>
    </div>
  </div>
</div>

<div id="viewReport" class="hide">
  <div class="card">
    <h2 class="sec" id="rTitle">學習報告</h2>
    <p class="secsub" id="rRange"></p>
    <div class="kpis" id="rKpis"></div>
    <div class="note" id="rMsg"></div>
    <h2 class="sec" style="margin-top:26px;font-size:19px">每次練習紀錄</h2>
    <div class="scroll"><table id="rLogs"></table></div>
    <div class="tools noprint">
      <button onclick="window.print()">列印 / 存成 PDF</button>
      <button onclick="show('teacher')">回到全班</button>
    </div>
  </div>
</div>

<div class="foot noprint" id="foot"></div>

</div>
<script>
const READINGS = [
{
 id:"costco", short:"好市多", order:1,
 title:"A Costco Card Is NOT a Passport",
 zh:"好市多會員卡不能當護照",
 words:226, kind:"對話",
 bg:"好市多（Costco）是會員制的大賣場，要辦一張會員卡才能進去買東西。這篇對話裡，Kathy 在網路上看到有人說「出國時拿好市多會員卡就能過機場安檢，不用帶護照」——這是假的。\n\nTSA 是美國的運輸安全管理局，負責機場安檢，他們規定一定要看有照片的官方證件，像護照或駕照。\n\n所以這篇表面上在講旅行，其實在講一件更重要的事：**網路上很多人在傳的事，不一定是真的**。",
 body:[
  {w:"Mike",  t:"I checked the list you made for our trip to New York, and I have a question. Why did you cross out “passport”?"},
  {w:"Kathy", t:"Well, we always keep our Costco cards in our wallets, don’t we?"},
  {w:"Mike",  t:"OK... so?"},
  {w:"Kathy", t:"I read on the Internet that you can use a Costco card at the airport as your ID. It’s more convenient."},
  {w:"Mike",  t:"Actually, no. That’s not true. I saw that post, too, but it’s only a rumor."},
  {w:"Kathy", t:"Really? But many people said it worked."},
  {w:"Mike",  t:"I know why people believed it. The posts said it’s easier — just show your Costco card when you fly, and the TSA will accept it. But both Costco and the TSA said that’s not true. You still need a real ID, like a driver’s license or a passport."},
  {w:"Kathy", t:"Oh, OK. I thought it would help me carry fewer cards."},
  {w:"Mike",  t:"I get it. But airport security has to be serious about checking who people really are carefully."},
  {w:"Kathy", t:"All right. Thanks for clearing that up. I’ll fix the list later. How’s your plan for Day 3 coming along?"},
  {w:"Mike",  t:"I’ve almost finished it. I’ll show you tonight."},
  {w:"Kathy", t:"Sounds good. I think planning this trip with you is safer and nicer!"}
 ],
 s1:[
  {w:"passport", zh:"護照", no:"駕照"},
  {w:"ID", zh:"身分證件", no:"網路貼文"},
  {w:"rumor", zh:"謠言", no:"行李"},
  {w:"accept", zh:"接受", no:"拒絕"},
  {w:"driver's license", zh:"駕照", no:"護照"},
  {w:"security", zh:"安檢", no:"折扣"},
  {w:"convenient", zh:"方便的", no:"危險的"},
  {w:"cross out", zh:"劃掉", no:"加上去"},
  {w:"post", zh:"（網路）貼文", no:"郵局"}
 ],
 s2:[
  {q:"「我在網路上看到，好市多會員卡可以在機場當身分證件。」", o:["Kathy","Mike"]},
  {q:"「那不是真的，那只是個謠言。」", o:["Mike","Kathy"]},
  {q:"「你為什麼把『護照』劃掉？」", o:["Mike","Kathy"]},
  {q:"「我以為那樣可以少帶幾張卡。」", o:["Kathy","Mike"]},
  {q:"「好市多和 TSA 都說那不是真的。」", o:["Mike","Kathy"]},
  {q:"「我等一下會把清單改好。」", o:["Kathy","Mike"]}
 ],
 s3:[
  {q:"Kathy 為什麼把 passport 從清單上劃掉？", o:["她以為好市多會員卡可以當身分證件","她把護照弄丟了","Mike 叫她不要帶","護照太重要，不能帶出門"]},
  {q:"文章裡的 rumor 最接近下面哪一個意思？", o:["很多人在傳、但不是真的事","一則讓大家驚訝的新聞","需要被更正的新聞","一個大家相信很久的老故事"]},
  {q:"TSA 是什麼？", o:["美國負責機場安檢的單位","一家賣東西的大賣場","一種身分證件","一間旅行社"]},
  {q:"Mike 說機場安檢必須怎麼做？", o:["仔細確認人的真實身分","讓大家帶越少卡越好","相信網路上的貼文","只檢查好市多會員卡"]},
  {q:"這段對話結束後，Kathy 最可能會做什麼？", o:["把護照加回清單","只帶好市多卡出國","取消這趟旅行","再去網路上找那則貼文"]}
 ],
 s4:[
  {q:"Why DIDN'T Kathy think they needed passports?", o:["She believed their Costco cards could be used as ID.","Passports are too important to carry around.","Mike told her to leave it at home.","She saw people use store cards as ID at the airport."], t:"精選試題 37"},
  {q:"What is a “rumor”?", o:["A story that is widely passed on but not true.","A piece of news that surprises everyone.","A piece of news that needs to be fixed.","An old story that people have believed for a long time."], t:"精選試題 38"},
  {q:"What can we learn from the dialogue?", o:["Kathy will put “passport” back on the list.","Kathy finished all the trip planning by herself.","Kathy and Mike will only bring Costco cards for the trip.","Mike once tried using a Costco card as ID but failed."], t:"精選試題 39"}
 ]
},
{
 id:"mona", short:"蒙娜麗莎", order:2,
 title:"Does the Mona Lisa’s Eyes Follow You?",
 zh:"蒙娜麗莎才沒在看你",
 words:252, kind:"說明文",
 bg:"《蒙娜麗莎》是達文西（Leonardo da Vinci）畫的一幅名畫，現在放在法國的羅浮宮，是全世界最有名的畫之一。\n\n很多人說「不管你站在哪個位置看，畫裡的人眼睛都會跟著你」——這個現象被叫做「蒙娜麗莎效應」。\n\n但 2019 年科學家做了實驗，發現**蒙娜麗莎本人其實沒有這個效果**，因為她的眼睛是看向旁邊的。這篇文章講的就是這個「大家都以為是這樣，但其實不是」的故事。",
 body:[
  {t:"Have you ever noticed that some pictures appear to follow you with their eyes? This illusion is called the “Mona Lisa effect.” It happens when the person in an image looks straight ahead, at an angle between 0 and 5 degrees."},
  {t:"Many people believe this effect is named after Leonardo da Vinci’s famous painting, the Mona Lisa, because they think she watches people who look at her. However, a 2019 study showed that this is not true. In the study, 24 people were asked to look at the Mona Lisa on a computer. They stood at different distances and angles. After more than 2,000 tests, not one person felt that the Mona Lisa was looking straight at them. In fact, her eyes are turned to the side, at an angle of about 15 degrees."},
  {t:"The Mona Lisa effect is real, but it only works when the person in the picture looks straight ahead. This illusion works at any angle or distance from which someone looks at the image."},
  {t:"So, how did the illusion get its name? No one knows for sure. What we do know is that this effect can be useful in many ways. For example, it is used in video games to help people feel closer to the virtual world. People can also use this trick to make their pictures or photos more interesting. Even though the Mona Lisa does not show this effect, people are still drawn to her eyes and smile."}
 ],
 s1:[
  {w:"illusion", zh:"錯覺", no:"事實"},
  {w:"effect", zh:"效應", no:"缺點"},
  {w:"image", zh:"圖像", no:"想像力"},

  const items=HOMEWORK.tasks.map(function(t){
    const b=bestOf(s,t.stage,HOMEWORK.reading);
    return {stage:t.stage,pass:t.pass,best:b,ok:(b!=null&&b>=t.pass)};
  });
  const done=items.filter(function(x){return x.ok;}).length;
  return {items:items,done:done,all:items.length,complete:(done===items.length)};
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function pool(){

    const w=wrongOf(seat);
    const hit=list.filter(function(x){ return w[x.id]; });

  return list;
}

function answer(ok,q,correct,btn){

    b.disabled=true; if(b.textContent===correct) b.classList.add("right"); });
  if(btn&&!ok) btn.classList.add("wrong");
  const fb=document.getElementById("fb"), w=wrongOf(seat);
  fb.className="fb show "+(ok?"good":"bad");
  if(ok){ right++; w[q.id]=false; fb.innerHTML="<span class='big'>✓ 答對了</span>"+STAGES[stage].t; }
  else{
    w[q.id]=true;
    fb.innerHTML="<span class='big'>再看一次就好</span>正確答案是 <b>"+esc(correct)+"</b>"
      + (stage===1?"　（回文章上面找找看）":"");
  }
  save(); drawChips();
  if(stage===0) say(q.w);
  const next=document.createElement("button");
  next.className="go"; next.style.marginTop="16px";
  next.textContent=idx+1>=queue.length?"看結果":"下一題 →";
  next.onclick=function(){ idx++; render(); };
  fb.appendChild(document.createElement("br")); fb.appendChild(next); next.focus();
}
function finish(){
  const prevBest=bestOf(seat,stage,cur.id), before=hwStatus(seat);
  store.logs.push({seat:seat,stage:stage,reading:cur.id,right:right,total:queue.length,ts:Date.now(),mode:poolMode});
  save(); drawHw("hwPractice", seat); updateWho();
  const after=hwStatus(seat);
  const justDone = after && after.complete && before && !before.complete;
  sendOut(seat,stage,right,queue.length,after);

  const nowBest=bestOf(seat,stage,cur.id), isBest=prevBest==null||right>prevBest;
  document.getElementById("count").textContent=queue.length+" / "+queue.length;
  document.getElementById("fill").style.width="100%";
  document.getElementById("best").textContent="最佳 "+nowBest+" 題";

  let msg; const rate=right/queue.length;
  if(justDone) msg="🎉 本週作業完成了！老師那邊會看到你做完了。";
  else if(isBest&&prevBest!=null) msg="破紀錄了！上次 "+prevBest+" 題，這次 "+right+" 題。";
  else if(rate===1) msg="全對。往上一階試試看。";
  else if(stage===1&&rate<.7) msg="沒關係，把文章打開，一句一句對照著找，第二次就會快很多。";
  else if(rate>=.7) msg="大部分都對了。錯的題目再練一次就好。";
  else msg="按下面的「只練錯過的題目」再跑一次，第二次一定會比第一次好。";

  document.getElementById("card").innerHTML=
    "<div class='done'><div class='score'>"+right+"</div>"
    +"<div class='of'>答對 "+right+" 題 / 共 "+queue.length+" 題（"+esc(cur.zh)+"）</div>"
    +"<div class='best'>你的最佳紀錄："+nowBest+" 題</div><br>"
    +"<p class='msg'>"+msg+"</p><div class='btnrow'>"
    +"<button class='go' onclick='start()'>再練一次</button>"
    +(stage<3?"<button class='go ghost' onclick='stage="+(stage+1)+";start()'>進到"+STAGES[stage+1].n+" →</button>":"")
    +"</div></div>";
  drawChips();
}
function wrongByStage(s){
  const w=store.wrong[s]||{}, c=[0,0,0,0];
  READINGS.forEach(function(r){
    [r.s1,r.s2,r.s3,r.s4].forEach(function(arr,si){
      arr.forEach(function(it){ if(w[it.id]) c[si]++; }); }); });
  return c;
}
function drawChips(){
  const c=wrongByStage(seat);
  const box=document.getElementById("chips"), mini=document.getElementById("mini");
  box.innerHTML=""; let total=0;
  c.forEach(function(n,i){ if(n){ total+=n;
    const s=document.createElement("span"); s.className="chip";
    s.textContent=STAGES[i].t+" "+n; box.appendChild(s); } });
  if(!total){
    box.innerHTML="<span class='chip clear'>目前沒有要再看的題目</span>";
    mini.textContent="答錯的題目會自動留在這裡，答對之後就會消失。"; return;
  }
  mini.textContent="共 "+total+" 題。按「只練錯過的題目」可以只練它們。";
}
function onlyWrong(){ poolMode="wrong"; start(); }
function allItems(){ poolMode="all"; start(); }

/* ---------- 送出 ---------- */
function sendOut(seat,stage,right,total,hw){
  if(!GFORM.url || isGuest(seat)) return;   // 訪客只存在本機，不進試算表
  const c=wrongByStage(seat), row={};
  row[GFORM.f.seat] = CLASS_ID.toUpperCase() + "-" + sname(seat);
  row[GFORM.f.lesson]=LESSON+"-"+cur.short;
  row[GFORM.f.stage]=STAGES[stage].n+" "+STAGES[stage].t;
  row[GFORM.f.right]=right;
  row[GFORM.f.total]=total;
  row[GFORM.f.wrong]=c.map(function(n,i){ return n?["生字","找不到","讀不懂","會考題"][i]+n:""; }).filter(Boolean).join(" ");
  row[GFORM.f.hw]=hw?(hw.complete?"已完成":"進行中 "+hw.done+"/"+hw.all):"";
  post(row);
}
function post(row){
  const body=new URLSearchParams();
  for(const k in row) body.append(k,row[k]);
  fetch(GFORM.url,{method:"POST",mode:"no-cors",body:body}).catch(function(){ queueRow(row); });
}
function queueRow(row){
  if(!store.pending) store.pending=[];
  store.pending.push(row);
  if(store.pending.length>200) store.pending=store.pending.slice(-200);
  save();
}
function flushPending(){
  if(!GFORM.url||!store.pending||!store.pending.length) return;
  const rows=store.pending.slice(); store.pending=[]; save();
  rows.forEach(function(r){ post(r); });
}

/* ---------- 老師檢視 ---------- */
function teacherGate(){
  const f=document.getElementById("foot");
  f.innerHTML =
    "<div style='display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center'>"
    + "<input type='password' id='tcode' placeholder='老師密碼' autocomplete='off' "
    +   "style='font-size:17px;padding:9px 14px;border:2px solid #E2DDD0;border-radius:10px;width:150px;font-family:inherit'>"
    + "<button id='tgo' style='background:#1F6B58;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:16px;cursor:pointer;font-family:inherit;text-decoration:none'>進入</button>"
    + "<button id='tno' style='background:none;border:2px solid #E2DDD0;color:#5A554C;border-radius:10px;padding:9px 16px;font-size:16px;cursor:pointer;font-family:inherit;text-decoration:none'>取消</button>"
    + "<span id='tmsg' style='color:#B23A32;font-size:15px'></span></div>";
  const i=document.getElementById("tcode");
  document.getElementById("tgo").onclick=tryCode;
  document.getElementById("tno").onclick=resetFoot;
  i.onkeydown=function(e){ if(e.key==="Enter") tryCode(); };
  i.focus();
}
function tryCode(){
  if(document.getElementById("tcode").value!==TEACHER_CODE){
    document.getElementById("tmsg").textContent="密碼不對"; return;
  }
  resetFoot(); drawTeacher(); show("teacher");
}
function resetFoot(){
  const f=document.getElementById("foot");
  f.innerHTML="<button>老師檢視</button>";
  f.firstChild.onclick=teacherGate;
}
function drawTeacher(){
  let doneN=0, hwDone=0;
  for(const i of SEAT_IDS){ if(logsOf(i).length) doneN++;
    const st=hwStatus(i); if(st&&st.complete) hwDone++; }
  document.getElementById("tSub").textContent=
    "全班 "+SEAT_IDS.length+" 人，已經練過的有 "+doneN+" 人"
    +(HOMEWORK.on?"，本週作業完成 "+hwDone+" 人":"")
    +"，總共 "+store.logs.filter(function(l){ return !isGuest(l.seat); }).length+" 次練習紀錄。";

  let h="<tr><th>座號</th><th>本週作業</th><th class='num'>練習次數</th><th>最近一次</th>"
    +STAGES.map(function(s){ return "<th class='num'>"+s.t+"</th>"; }).join("")
    +"<th class='num'>還要再看</th></tr>";
  for(const i of SEAT_IDS){
    const ls=logsOf(i), st=hwStatus(i);
    const c=wrongByStage(i); let wn=0; c.forEach(function(n){ wn+=n; });
    const hwCell=!st?"—":(st.complete?"<span class='ok'>✅ 已完成</span>"
      :(ls.length?"<span class='wait'>進行中 "+st.done+"/"+st.all+"</span>":"<span class='wait'>未開始</span>"));
    if(!ls.length){
      h+="<tr class='none'><td>"+sname(i)+"</td><td>"+hwCell+"</td><td class='num'>—</td><td>還沒做</td>"
        +STAGES.map(function(){ return "<td class='num'>—</td>"; }).join("")+"<td class='num'>—</td></tr>";
      continue;
    }
    const last=ls[ls.length-1];
    h+="<tr><td><span class='seatlink' onclick='drawReport(\""+i+"\")'>"+sname(i)+"</span></td>"
      +"<td>"+hwCell+"</td><td class='num'>"+ls.length+"</td><td>"+ymdhm(last.ts)+"</td>"
      +STAGES.map(function(s,si){ const b=bestOf(i,si,HOMEWORK.reading);
          return "<td class='num'>"+(b==null?"—":b)+"</td>"; }).join("")
      +"<td class='num'>"+wn+"</td></tr>";
  }
  document.getElementById("tClass").innerHTML=h;

  const tot=[0,0,0,0];
  for(const i of SEAT_IDS){ const c=wrongByStage(i); c.forEach(function(n,si){ tot[si]+=n; }); }
  const maxN=Math.max.apply(null,tot)||1;
  let h2="<tr><th>階段</th><th>能力</th><th class='num'>全班還沒過的題數</th><th></th></tr>";
  const skills=["生字不夠","找不到出處","讀不懂句子","會考題型不熟"];
  STAGES.forEach(function(s,si){
    h2+="<tr><td><b>"+s.n+"　"+s.t+"</b></td><td>"+skills[si]+"</td>"
      +"<td class='num'>"+tot[si]+"</td>"
      +"<td><span class='barcell'><i style='width:"+(tot[si]/maxN*160)+"px'></i></span></td></tr>";
  });
  document.getElementById("tWrong").innerHTML=h2;
}

/* ---------- 個人報告 ---------- */
function drawReport(s){
  const ls=logsOf(s);
  document.getElementById("rTitle").textContent="座號 "+s+"　閱讀練習報告";
  if(!ls.length){ document.getElementById("rRange").textContent="還沒有練習紀錄。"; show("report"); return; }
  const first=ls[0], last=ls[ls.length-1];
  document.getElementById("rRange").textContent="統計期間："+ymd(first.ts)+" ～ "+ymd(last.ts);
  const days={}; ls.forEach(function(l){ days[ymd(l.ts)]=1; });
  const reads={}; ls.forEach(function(l){ reads[l.reading]=1; });
  const c=wrongByStage(s); let wn=0; c.forEach(function(n){ wn+=n; });
  const st=hwStatus(s);
  document.getElementById("rKpis").innerHTML=
    kpi("練習次數",ls.length+" 次")+kpi("練習天數",Object.keys(days).length+" 天")
    +kpi("讀過的文章",Object.keys(reads).length+" / "+READINGS.length+" 篇")
    +kpi("還要再看",wn+" 題")
    +(st?kpi("本週作業",st.complete?"已完成":"進行中 "+st.done+"/"+st.all):"");
  document.getElementById("rMsg").textContent =
    ls.length>=3 ? "已經主動練了 "+ls.length+" 次。閱讀最需要的就是一直讀下去，次數比分數重要。"
                 : "才剛開始，先看練習次數就好，分數會慢慢跟上來。";
  let h="<tr><th>日期</th><th>文章</th><th>階段</th><th class='num'>答對</th><th class='num'>題數</th><th>備註</th></tr>";
  ls.slice().reverse().forEach(function(l){
    const r=R(l.reading);
    h+="<tr><td>"+ymdhm(l.ts)+"</td><td>"+(r?esc(r.zh):l.reading)+"</td>"
      +"<td>"+STAGES[l.stage].n+"　"+STAGES[l.stage].t+"</td>"
      +"<td class='num'>"+l.right+"</td><td class='num'>"+l.total+"</td>"
      +"<td>"+(l.mode==="wrong"?"只練錯過的":"")+"</td></tr>";
  });
  document.getElementById("rLogs").innerHTML=h;
  show("report");
}
function kpi(l,v){ return "<div class='kpi'><span>"+l+"</span><b class='big2'>"+v+"</b></div>"; }

function exportCSV(){
  const rows=[["座號","日期時間","文章","階段","答對","題數","模式"]];
  store.logs.filter(function(l){ return !isGuest(l.seat); }).sort(function(a,b){ return a.seat-b.seat||a.ts-b.ts; }).forEach(function(l){
    const r=R(l.reading);
    rows.push([l.seat,ymdhm(l.ts),(r?r.zh:l.reading),STAGES[l.stage].n+" "+STAGES[l.stage].t,
               l.right,l.total,l.mode==="wrong"?"只練錯的":"全部"]);
  });
  const csv="\ufeff"+rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="閱讀練習紀錄_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function wipe(){
  if(!confirm("要清空全班所有紀錄嗎？這個動作無法復原。")) return;
  if(!confirm("再確認一次：所有座號的練習紀錄都會不見。")) return;
  store={logs:[],wrong:{}}; save(); drawTeacher(); drawSeats();
}

drawHw("hwSeat", null); resetFoot(); drawSeats(); show("seat"); flushPending();
</script>
